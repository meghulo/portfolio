<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin — Sukesh Khisa</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ec;--ink:#16201f;--mut:#667371;--teal:#0f3d3a;--acc:#c8821f;--line:#e2ded3}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 16px;background:var(--teal);color:#fff}
button.p{background:var(--acc)}button.g{background:#fff;color:var(--ink);border:1px solid var(--line);padding:6px 12px}
button:disabled{opacity:.5}:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);
     padding:12px clamp(12px,3vw,28px);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar b{font-size:18px;margin-right:auto}
.chip{font-size:13px;padding:3px 10px;border-radius:99px;background:#e4efe9;color:#1b6b4a}
.chip.d{background:#fbeccf;color:#8a5a0a}
#set{display:none;background:#fff;border-bottom:1px solid var(--line);padding:14px clamp(12px,3vw,28px)}
#set.on{display:block}
#set .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
#set p{font-size:13px;color:var(--mut);margin:8px 0 0}
main{display:grid;grid-template-columns:270px 1fr;gap:18px;padding:18px clamp(12px,3vw,28px);max-width:1200px;margin:0 auto}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
input,textarea{width:100%;padding:9px 11px;margin-top:4px;border:1px solid #d3cfc3;border-radius:8px;font:inherit;background:#fff}
.s{display:flex;gap:4px;margin-bottom:6px}
.s .n{flex:1;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line)}
.s .n.on{border-color:var(--teal);background:#e7f0ee;font-weight:600}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.kind button{background:#fff;color:var(--ink);border:2px solid var(--line);text-align:left;padding:12px}
.kind button.on{border-color:var(--teal);background:#e7f0ee}
.kind small{display:block;color:var(--mut)}
.it{display:grid;grid-template-columns:120px 1fr;gap:16px}
@media(max-width:600px){.it{grid-template-columns:1fr}}
.th{aspect-ratio:4/5;border-radius:8px;background:#ebe7dc center/cover;
    display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;text-align:center}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.up{display:inline-block;margin-top:8px}.up input{display:none}
.up span{display:inline-block;padding:6px 12px;border:1px dashed var(--teal);border-radius:8px;cursor:pointer;font-size:14px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#16201f;color:#fff;
       padding:10px 18px;border-radius:99px;display:none;z-index:9;max-width:92vw;text-align:center}
</style>
</head>
<body>

<div class="bar">
  <b>অ্যাডমিন প্যানেল</b>
  <span class="chip" id="ch">সব সেভ করা আছে</span>
  <button class="g" onclick="document.getElementById('set').classList.toggle('on')">সংযোগ সেটিং</button>
  <a href="index.html" target="_blank" class="g" style="text-decoration:none;color:var(--ink)">সাইট দেখুন</a>
  <button class="g" onclick="dl()">ব্যাকআপ</button>
  <button class="p" id="pub" onclick="save()">প্রকাশ করুন</button>
</div>

<div id="set">
  <div class="row">
    <div><label>GitHub repo (username/repo)</label><input id="repo" placeholder="username/repo-name"></div>
    <div><label>Branch</label><input id="br" placeholder="main"></div>
    <div><label>Fine-grained access token</label><input id="tk" type="password" placeholder="github_pat_..."></div>
  </div>
  <p>এই তথ্য শুধু আপনার ব্রাউজারে (localStorage) থাকে। token-এ শুধু ওই repo-র <b>Contents: Read and write</b> অনুমতি দিন।</p>
</div>

<main>
  <aside>
    <div class="card">
      <b>সাইট</b>
      <label>সাইটের নাম</label><input id="ti" oninput="C.site.title=this.value;mk()">
      <label>পরিচিতি লাইন (role)</label><input id="ro" oninput="C.site.role=this.value;mk()">
      <label>ট্যাগলাইন</label><input id="tg" oninput="C.site.tagline=this.value;mk()">
      <label>ইংরেজি নাম (এআই-এর জন্য)</label><input id="en" oninput="C.site.en=this.value;mk()">
    </div>
    <div class="card">
      <b>সেকশন</b>
      <div id="secs" style="margin-top:10px"></div>
      <button onclick="addS()">+ নতুন সেকশন</button>
    </div>
  </aside>
  <section id="ed"></section>
</main>

<div id="toast"></div>

<script>
let C={site:{title:'',role:'',tagline:'',en:''},sections:[]};
let cur=0, pend={}, prev={}, dirty=0;

const $=s=>document.getElementById(s);
const set=$('set');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const cfg=JSON.parse(localStorage.adm||'{}');
$('repo').value=cfg.repo||'';
$('br').value=cfg.br||'main';
$('tk').value=cfg.tk||'';
if(!cfg.tk) set.classList.add('on');

function toast(t){
  const e=$('toast'); e.textContent=t; e.style.display='block';
  clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.display='none',4500);
}
function mk(){
  dirty=1;
  $('ch').textContent='অসেভ পরিবর্তন আছে';
  $('ch').className='chip d';
}
addEventListener('beforeunload',e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

const mv=(a,i,d)=>{ const j=i+d; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; mk(); };
const S=()=>C.sections[cur];
const E=(j,k,v)=>{ S().items[j][k]=v; mk(); };

function draw(){
  $('ti').value=C.site.title||'';
  $('ro').value=C.site.role||'';
  $('tg').value=C.site.tagline||'';
  $('en').value=C.site.en||'';
  $('secs').innerHTML=C.sections.map((s,i)=>`
    <div class="s">
      <button class="n ${i===cur?'on':''}" id="sl${i}" onclick="cur=${i};draw()">${esc(s.name)||'(নামহীন)'}</button>
      <button class="g" onclick="mv(C.sections,${i},-1);cur=Math.max(0,i-1);draw()">↑</button>
      <button class="g" onclick="mv(C.sections,${i},1);cur=Math.min(C.sections.length-1,i+1);draw()">↓</button>
    </div>`).join('');

  const s=S();
  if(!s){
    $('ed').innerHTML='<div class="card">বাঁ দিক থেকে একটি সেকশন বেছে নিন বা নতুন বানান।</div>';
    return;
  }
  $('ed').innerHTML=`
    <div class="card">
      <b>সেকশনের তথ্য</b>
      <label>নাম</label>
      <input value="${esc(s.name)}" oninput="S().name=this.value;document.getElementById('sl${cur}').textContent=this.value||'(নামহীন)';mk()">
      <label>ছোট বর্ণনা</label>
      <input value="${esc(s.desc)}" oninput="S().desc=this.value;mk()">
      <label>ধরন</label>
      <div class="kind">
        <button class="${s.kind==='wall'?'on':''}" onclick="S().kind='wall';mk();draw()">দেয়াল<small>ছবি ও ডিজাইনের ফ্রেম</small></button>
        <button class="${s.kind==='notebook'?'on':''}" onclick="S().kind='notebook';mk();draw()">খাতা<small>লেখা ও স্কিলের তালিকা</small></button>
      </div>
      <div class="acts">
        <button class="g" onclick="if(confirm('এই সেকশন ও ভেতরের সব আইটেম মুছবেন?')){C.sections.splice(cur,1);cur=0;mk();draw()}">সেকশন মুছুন</button>
      </div>
    </div>`+s.items.map((it,j)=>`
      <div class="card it">
        <div class="th" style="${it.image?`background-image:url('${esc(prev[it.image]||it.image)}')`:''}">${it.image?'':'ছবি নেই'}</div>
        <div>
          <label>শিরোনাম</label>
          <input value="${esc(it.title)}" oninput="E(${j},'title',this.value)">
          <label>লেখা</label>
          <textarea rows="3" oninput="E(${j},'text',this.value)">${esc(it.text)}</textarea>
          <label>লিংক (ঐচ্ছিক)</label>
          <input value="${esc(it.link)}" oninput="E(${j},'link',this.value)">
          <label class="up"><input type="file" accept="image/*,.pdf" onchange="up(${j},this)"><span>ছবি বা PDF আপলোড</span></label>
          ${it.file?`<div style="font-size:13px;margin-top:6px">ফাইল: ${esc(it.file)}</div>`:''}
          <div class="acts">
            <button class="g" onclick="mv(S().items,${j},-1);draw()">↑</button>
            <button class="g" onclick="mv(S().items,${j},1);draw()">↓</button>
            ${it.image?`<button class="g" onclick="E(${j},'image','');draw()">ছবি সরান</button>`:''}
            ${it.file?`<button class="g" onclick="E(${j},'file','');draw()">ফাইল সরান</button>`:''}
            <button class="g" onclick="if(confirm('আইটেমটি মুছবেন?')){S().items.splice(${j},1);mk();draw()}">মুছুন</button>
          </div>
        </div>
      </div>`).join('')+`
      <button onclick="S().items.push({title:'',text:'',link:'',image:'',file:''});mk();draw()">+ নতুন আইটেম</button>`;
}

const addS=()=>{
  C.sections.push({id:'s'+Date.now().toString(36),name:'নতুন সেকশন',desc:'',kind:'wall',items:[]});
  cur=C.sections.length-1; mk(); draw();
};

function up(j,inp){
  const f=inp.files[0]; if(!f) return;
  const it=S().items[j];
  if(f.type.startsWith('image/')){
    const im=new Image;
    im.onload=()=>{
      const k=Math.min(1,1600/Math.max(im.width,im.height));
      const c=document.createElement('canvas');
      c.width=im.width*k; c.height=im.height*k;
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      const u=c.toDataURL('image/jpeg',.85);
      const p='images/'+Date.now()+'.jpg';
      pend[p]=u.split(',')[1];
      prev[p]=u;
      it.image=p; mk(); draw();
    };
    im.src=URL.createObjectURL(f);
  } else {
    const r=new FileReader;
    r.onload=()=>{
      const p='files/'+Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_');
      pend[p]=r.result.split(',')[1];
      it.file=p; mk(); draw();
    };
    r.readAsDataURL(f);
  }
}

// ---- generators ----
function genAgent(){
  const s=C.site;
  const n=s.en?`${s.title} (${s.en})`:s.title;
  return {
    schema:'portfolio-agent/1',
    person:{name:n,role:s.role||'',tagline:s.tagline||''},
    sections:C.sections.map(x=>({
      id:x.id,name:x.name,
      kind:x.kind==='wall'?'gallery':'notes',
      description:x.desc||'',
      items:x.items.map(i=>({
        title:i.title,text:i.text,
        link:i.link||undefined,image:i.image||undefined,file:i.file||undefined
      }))
    })),
    updated:new Date().toISOString()
  };
}
function genLLMS(){
  const s=C.site;
  const n=s.en?`${s.title} (${s.en})`:s.title;
  return `# ${n}\n> ${s.role||''}\n\n`+C.sections.map(x=>
    `## ${x.name}\n${x.desc||''}\n\n`+x.items.map(i=>
      `- ${i.title}: ${String(i.text).replace(/\n/g,' ')}${i.link?` (${i.link})`:''}`
    ).join('\n')
  ).join('\n\n')+'\n';
}
function genAiHtml(){
  const s=C.site;
  const n=s.en?`${s.title} (${s.en})`:s.title;
  return `<!doctype html><html lang="bn"><head><meta charset="utf-8">`+
    `<title>${esc(n)} | for AI agents</title>`+
    `<meta name="viewport" content="width=device-width,initial-scale=1">`+
    `<link rel="alternate" type="application/json" href="agent.json">`+
    `<link rel="alternate" type="text/markdown" href="llms.txt">`+
    `</head><body style="font:16px/1.7 system-ui;max-width:760px;margin:30px auto;padding:0 16px">`+
    `<h1>${esc(n)}</h1><p>${esc(s.role)}</p>`+
    C.sections.map(x=>`<section id="${esc(x.id)}"><h2>${esc(x.name)}</h2>`+
      `<p>${esc(x.desc)}</p><ul>`+
      x.items.map(i=>`<li><b>${esc(i.title)}</b>: ${esc(i.text).replace(/\n/g,'<br>')}`+
        `${i.link?` <a href="${esc(i.link)}">link</a>`:''}</li>`).join('')+
      `</ul></section>`).join('')+
    `<p><a href="agent.json">agent.json</a> | <a href="llms.txt">llms.txt</a> | <a href="index.html">মানব ভিউ</a></p>`+
    `</body></html>`;
}

// ---- GitHub API ----
const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function gh(path,method='GET',body){
  const u=`https://api.github.com/repos/${cfg.repo}/contents/${path}`+(method==='GET'?`?ref=${cfg.br}`:'');
  const r=await fetch(u,{
    method,
    headers:{Authorization:'Bearer '+cfg.tk,Accept:'application/vnd.github+json','Content-Type':'application/json'},
    body:body?JSON.stringify({...body,branch:cfg.br}):undefined
  });
  if(method==='GET'&&r.status===404) return null;
  if(!r.ok){
    const msg=r.status===401?'token ঠিক নেই':
              r.status===403?'token-এর permission নেই':
              r.status===404?'repo/branch পাওয়া যায়নি':'কোড '+r.status;
    throw new Error(msg);
  }
  return r.json();
}
async function putText(path,text,message){
  const o=await gh(path);
  return gh(path,'PUT',{message,content:b64(text),sha:o?.sha});
}
async function putBinary(path,b64content,message){
  const o=await gh(path);
  return gh(path,'PUT',{message,content:b64content,sha:o?.sha});
}

async function save(){
  Object.assign(cfg,{
    repo:$('repo').value.trim(),
    br:$('br').value.trim()||'main',
    tk:$('tk').value.trim()
  });
  localStorage.adm=JSON.stringify(cfg);
  if(!cfg.repo||!cfg.tk){ set.classList.add('on'); return toast('repo ও token দিন'); }

  $('pub').disabled=true;
  try{
    toast('প্রকাশ হচ্ছে...');
    for(const p in pend) await putBinary(p,pend[p],'admin: add '+p);
    await putText('content.json',JSON.stringify(C,null,1),'admin: update content.json');
    await putText('agent.json',JSON.stringify(genAgent(),null,1),'admin: update agent.json');
    await putText('llms.txt',genLLMS(),'admin: update llms.txt');
    await putText('ai.html',genAiHtml(),'admin: update ai.html');
    pend={}; dirty=0;
    $('ch').textContent='সব সেভ করা আছে'; $('ch').className='chip';
    toast('প্রকাশিত! মানুষ ও এআই — দুটোই ১–২ মিনিটে আপডেট হবে।');
  }catch(e){ toast('ব্যর্থ: '+e.message); }
  $('pub').disabled=false;
}

function dl(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(C,null,1)],{type:'application/json'}));
  a.download='content.json'; a.click();
}

fetch('content.json?v='+Date.now())
  .then(r=>r.json())
  .then(j=>C=j)
  .catch(()=>{})
  .finally(draw);
</script>
</body>
</html>
