<!doctype html>
<html lang="bn" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>সুকেশ খীসা — Sukesh Khisa</title>
<meta name="description" content="ইন্টার্ন সাংবাদিক ও ক্রিয়েটিভ প্রফেশনাল, রাঙামাটি।">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate" type="application/json" href="agent.json">
<link rel="alternate" type="text/markdown" href="llms.txt">
<!-- নতুন ফন্ট: Outfit (ইংরেজি) এবং Hind Siliguri (বাংলা) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --text: #09090b;
  --text-muted: #71717a;
  --accent: #6366f1;
  --accent-hover: #4f46e5;
  --border: #e4e4e7;
  --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08);
  --shadow-hover: 0 20px 40px -10px rgba(99, 102, 241, 0.15);
  --radius: 20px;
  --font-en: 'Outfit', sans-serif;
  --font-bn: 'Hind Siliguri', sans-serif;
  --pad: clamp(20px, 5vw, 60px);
}

[data-theme="dark"] {
  --bg: #09090b;
  --surface: #18181b;
  --text: #f4f4f5;
  --text-muted: #a1a1aa;
  --accent: #818cf8;
  --accent-hover: #a5b4fc;
  --border: #27272a;
  --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
  --shadow-hover: 0 20px 40px -10px rgba(129, 140, 248, 0.2);
}

* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); font: 17px/1.7 var(--font-bn); min-height: 100dvh; transition: background 0.3s, color 0.3s; overflow-x: hidden; }
h1, h2, h3, .brand { font-family: var(--font-en), var(--font-bn); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

/* Navbar */
.navbar { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 1100px; z-index: 50; background: rgba(var(--surface), 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 99px; transition: all 0.3s; }
[data-theme="dark"] .navbar { background: rgba(24, 24, 27, 0.7); }
.nav-container { padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
.brand { font-size: 20px; font-weight: 600; letter-spacing: -0.5px; }
.nav-links { display: flex; gap: 24px; align-items: center; font-size: 14px; font-weight: 500; }
.nav-links a { color: var(--text-muted); transition: color 0.2s; }
.nav-links a:hover { color: var(--text); }
.theme-toggle { background: var(--bg); border: 1px solid var(--border); padding: 6px 14px; border-radius: 99px; font-size: 13px; display: flex; align-items: center; gap: 6px; font-family: var(--font-en); font-weight: 600; }
@media(max-width: 850px) { .nav-links { display: none; } }

/* Hero */
.hero { max-width: 1000px; margin: 0 auto; padding: clamp(140px, 25vh, 240px) var(--pad) 80px; text-align: center; position: relative; }
/* Background Glow */
.hero::before { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 600px; height: 600px; background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%); z-index: -1; filter: blur(40px); }
.hero-role { color: var(--accent); font-weight: 600; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 24px; display: inline-block; background: rgba(99, 102, 241, 0.1); padding: 8px 16px; border-radius: 99px; }
h1 { font-size: clamp(48px, 10vw, 100px); font-weight: 700; letter-spacing: -2px; line-height: 1.1; margin-bottom: 24px; background: linear-gradient(135deg, var(--text), var(--text-muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.hero-tagline { font-size: clamp(18px, 3vw, 24px); color: var(--text-muted); max-width: 600px; margin: 0 auto; }

/* Sections */
.container { max-width: 1100px; margin: 0 auto; padding: 0 var(--pad) 80px; }
.section-header { margin-bottom: 40px; text-align: center; }
.section-title { font-size: clamp(32px, 5vw, 48px); font-weight: 600; letter-spacing: -1px; margin-bottom: 12px; }
.section-desc { color: var(--text-muted); font-size: 18px; }

/* Gallery Grid (Modern Cards) */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); cursor: pointer; display: flex; flex-direction: column; }
.card:hover { transform: translateY(-8px); box-shadow: var(--shadow-hover); border-color: var(--accent); }
.card-img-wrap { width: 100%; aspect-ratio: 4/3; background: var(--bg); position: relative; overflow: hidden; }
.card-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s; }
.card:hover .card-img-wrap img { transform: scale(1.05); }
/* সুন্দর গ্রেডিয়েন্ট প্লেসহোল্ডার */
.card-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 30px; text-align: center; font: 600 24px var(--font-bn); color: #fff; background: linear-gradient(135deg, var(--accent), #8b5cf6); text-shadow: 0 2px 10px rgba(0,0,0,0.2); transition: transform 0.4s; }
.card:hover .card-placeholder { transform: scale(1.02); }
.card-body { padding: 28px; flex: 1; display: flex; flex-direction: column; }
.card-title { font-size: 22px; font-weight: 600; margin-bottom: 10px; }
.card-text { color: var(--text-muted); font-size: 15px; flex: 1; line-height: 1.6; }

/* Notebook Grid (Timeline Style) */
.notes-list { display: flex; flex-direction: column; gap: 20px; max-width: 800px; margin: 0 auto; }
.note-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; box-shadow: var(--shadow); transition: all 0.3s; position: relative; overflow: hidden; }
.note-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); opacity: 0; transition: opacity 0.3s; }
.note-item:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
.note-item:hover::before { opacity: 1; }
.note-title { font-size: 22px; font-weight: 600; margin-bottom: 12px; color: var(--text); }
.note-text { color: var(--text-muted); line-height: 1.8; font-size: 16px; white-space: pre-wrap; }
.note-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; color: var(--accent); font-weight: 600; font-size: 15px; transition: gap 0.2s; }
.note-link:hover { gap: 10px; }

/* Contact Form */
.contact-section { max-width: 700px; margin: 0 auto 100px; padding: 0 var(--pad); }
.contact-form { background: var(--surface); padding: clamp(24px, 5vw, 48px); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
.form-group { margin-bottom: 24px; }
.form-group label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 15px; color: var(--text); }
.form-group input, .form-group textarea { width: 100%; padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--text); font: inherit; transition: border-color 0.2s, box-shadow 0.2s; }
.form-group input:focus, .form-group textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
.submit-btn { background: var(--accent); color: #fff; padding: 16px 32px; border-radius: 12px; font-weight: 600; font-size: 16px; width: 100%; transition: background 0.2s, transform 0.2s; }
.submit-btn:hover { background: var(--accent-hover); transform: translateY(-2px); }
.form-status { margin-top: 20px; padding: 16px; border-radius: 12px; text-align: center; font-weight: 500; display: none; }
.form-status.success { background: rgba(34, 197, 94, 0.1); color: #16a34a; display: block; border: 1px solid rgba(34, 197, 94, 0.2); }
.form-status.error { background: rgba(239, 68, 68, 0.1); color: #dc2626; display: block; border: 1px solid rgba(239, 68, 68, 0.2); }

/* Footer */
footer { border-top: 1px solid var(--border); padding: 40px var(--pad); text-align: center; color: var(--text-muted); font-size: 15px; }
footer a { color: var(--text); margin: 0 12px; font-weight: 500; transition: color 0.2s; }
footer a:hover { color: var(--accent); }

/* Lightbox */
#lb { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; padding: 24px; }
#lb.on { display: flex; }
.lb-content { background: var(--surface); border-radius: var(--radius); max-width: 900px; width: 100%; max-height: 90vh; overflow: auto; position: relative; border: 1px solid var(--border); animation: zoomIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
.lb-img { width: 100%; max-height: 60vh; object-fit: contain; background: #000; }
.lb-body { padding: clamp(24px, 5vw, 40px); }
.lb-title { font-size: 32px; font-weight: 600; margin-bottom: 16px; }
.lb-text { color: var(--text-muted); font-size: 17px; line-height: 1.8; white-space: pre-wrap; }
.lb-close { position: absolute; top: 16px; right: 16px; width: 44px; height: 44px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
.lb-close:hover { background: var(--bg); transform: rotate(90deg); }
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a class="brand" id="nav-brand" href="#">সুকেশ খীসা</a>
    <div class="nav-links" id="nav-links"></div>
    <button class="theme-toggle" onclick="toggleTheme()">
      <span id="theme-icon">🌙</span> <span id="theme-text">DARK</span>
    </button>
  </div>
</nav>

<header class="hero">
  <span class="hero-role" id="hero-role"></span>
  <h1 id="hero-title"></h1>
  <p class="hero-tagline" id="hero-tagline"></p>
</header>

<main class="container" id="main-content">
  <!-- Dynamic Content -->
</main>

<!-- Contact Form Section -->
<section class="contact-section" id="contact">
  <div class="section-header">
    <h2 class="section-title">যোগাযোগ করুন</h2>
    <p class="section-desc">কোনো কাজ, সহযোগিতা বা মতামত জানাতে চাইলে নিচের ফর্মটি পূরণ করুন।</p>
  </div>
  
  <!-- FormSubmit.co ব্যবহার করা হয়েছে (Vercel-এর জন্য) -->
  <form class="contact-form" id="contact-form">
    <div class="form-group">
      <label>আপনার নাম</label>
      <input type="text" name="name" required placeholder="আপনার পূর্ণ নাম">
    </div>
    <div class="form-group">
      <label>ইমেইল ঠিকানা</label>
      <input type="email" name="email" required placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>মেসেজ</label>
      <textarea name="message" rows="5" required placeholder="আপনার মেসেজটি এখানে লিখুন..."></textarea>
    </div>
    <button type="submit" class="submit-btn" id="submit-btn">মেসেজ পাঠান</button>
    <div id="form-status" class="form-status"></div>
  </form>
</section>

<footer>
  <p>© <span id="year"></span> সুকেশ খীসা. All rights reserved.</p>
  <div style="margin-top: 20px;">
    <a href="ai.html">For AI Agents</a>
    <a href="agent.json">agent.json</a>
    <a href="llms.txt">llms.txt</a>
  </div>
</footer>

<div id="lb">
  <div class="lb-content" id="lb-content"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D = null;

// Theme Logic
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.theme = isDark ? 'light' : 'dark';
  updateThemeUI(!isDark);
}
function updateThemeUI(isDark) {
  $('#theme-icon').textContent = isDark ? '☀️' : '🌙';
  $('#theme-text').textContent = isDark ? 'LIGHT' : 'DARK';
}
if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
  document.documentElement.setAttribute('data-theme', 'dark');
  updateThemeUI(true);
} else {
  document.documentElement.setAttribute('data-theme', 'light');
  updateThemeUI(false);
}

// Sections Rendering
function renderSections() {
  let html = '';
  D.sections.forEach((sec) => {
    if (sec.id === 'contact') return; 
    
    html += `<section id="${esc(sec.id)}" style="margin-bottom: 100px;">`;
    html += `
      <div class="section-header">
        <h2 class="section-title">${esc(sec.name)}</h2>
        <p class="section-desc">${esc(sec.desc)}</p>
      </div>`;
    
    if (sec.kind === 'wall') {
      html += '<div class="grid">';
      sec.items.forEach((item, j) => {
        html += `
          <div class="card" onclick="openLB('${esc(sec.id)}', ${j})">
            <div class="card-img-wrap">
              ${item.image ? `<img src="${esc(item.image)}" alt="${esc(item.title)}" loading="lazy">` : `<div class="card-placeholder">${esc(item.title)}</div>`}
            </div>
            <div class="card-body">
              <h3 class="card-title">${esc(item.title)}</h3>
              <p class="card-text">${esc(String(item.text||'').slice(0, 85))}...</p>
            </div>
          </div>`;
      });
      html += '</div>';
    } else {
      html += '<div class="notes-list">';
      sec.items.forEach(item => {
        html += `
          <div class="note-item">
            <h3 class="note-title">${esc(item.title)}</h3>
            <p class="note-text">${esc(item.text)}</p>
            ${item.link ? `<a href="${esc(item.link)}" target="_blank" class="note-link">লিংক দেখুন <span>→</span></a>` : ''}
          </div>`;
      });
      html += '</div>';
    }
    html += `</section>`;
  });
  $('#main-content').innerHTML = html;
}

// Lightbox
function openLB(secId, itemIndex) {
  const sec = D.sections.find(s => s.id === secId);
  const item = sec.items[itemIndex];
  $('#lb-content').innerHTML = `
    <button class="lb-close" onclick="closeLB()">×</button>
    ${item.image ? `<img src="${esc(item.image)}" class="lb-img">` : ''}
    <div class="lb-body">
      <h3 class="lb-title">${esc(item.title)}</h3>
      <p class="lb-text">${esc(item.text)}</p>
      ${item.link ? `<a href="${esc(item.link)}" target="_blank" class="note-link" style="margin-top:20px;">লিংক দেখুন <span>→</span></a>` : ''}
    </div>`;
  $('#lb').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeLB() {
  $('#lb').classList.remove('on');
  document.body.style.overflow = '';
}
$('#lb').addEventListener('click', e => { if(e.target.id === 'lb') closeLB(); });

// ✅ Contact Form Submission (FormSubmit.co for Vercel)
$('#contact-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#submit-btn');
  const status = $('#form-status');
  btn.disabled = true;
  btn.textContent = 'পাঠানো হচ্ছে...';
  status.className = 'form-status';
  status.textContent = '';

  const formData = new FormData(e.target);
  const object = Object.fromEntries(formData);
  const json = JSON.stringify(object);

  try {
    // FormSubmit.co API (সরাসরি ইমেইলে যাবে)
    const res = await fetch("https://formsubmit.co/ajax/sukeshkhisa1@gmail.com", {
      method: "POST",
      headers: { 
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: json
    });
    
    if (res.ok) {
      status.textContent = '✅ আপনার মেসেজ সফলভাবে পাঠানো হয়েছে!';
      status.className = 'form-status success';
      e.target.reset();
    } else {
      throw new Error('Failed');
    }
  } catch (err) {
    status.textContent = '❌ দুঃখিত, মেসেজ পাঠানো সম্ভব হয়নি। আবার চেষ্টা করুন।';
    status.className = 'form-status error';
  } finally {
    btn.disabled = false;
    btn.textContent = 'মেসেজ পাঠান';
    setTimeout(() => { status.className = 'form-status'; }, 5000);
  }
});

async function boot() {
  try {
    const res = await fetch('content.json?v=' + Date.now());
    D = await res.json();
  } catch (e) {
    $('#main-content').innerHTML = '<p>ডেটা লোড করা যায়নি।</p>';
    return;
  }

  document.title = D.site.title + (D.site.en ? ' — ' + D.site.en : '');
  $('#nav-brand').textContent = D.site.title;
  $('#hero-title').textContent = D.site.title;
  $('#hero-role').textContent = D.site.role || '';
  $('#hero-tagline').textContent = D.site.tagline || '';
  $('#year').textContent = new Date().getFullYear();

  const navLinks = D.sections.map(s => {
    if (s.id === 'contact') return ''; 
    return `<a href="#${esc(s.id)}">${esc(s.name)}</a>`;
  }).join('');
  $('#nav-links').innerHTML = navLinks + '<a href="#contact">যোগাযোগ</a>';

  renderSections();
}
boot();
</script>
</body>
</html>
