<style>
:root{
  --bg:#fbfaf7; --paper:#f4f2ec; --ink:#1a1d20; --green:#2f5d50; --muted:#6b7378;
  --line:rgba(26,29,32,.12);
  --serif:'Noto Serif Bengali',Georgia,serif;
  --sans:'Hind Siliguri',system-ui,sans-serif;
  --pad:clamp(20px,6vw,80px);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.7 var(--sans);min-height:100dvh;transition:background .4s,color .4s}
body.ai{background:#0f1316;color:#d9e1e4}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--green);outline-offset:4px}

/* Header */
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:max(24px,env(safe-area-inset-top)) max(var(--pad),env(safe-area-inset-right))
           24px max(var(--pad),env(safe-area-inset-left));
    max-width:1560px;margin-inline:auto;position:relative;z-index:10}
.brand{font:600 18px var(--serif);letter-spacing:.02em}
.sw{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:4px}
body.ai .sw{background:#161b1e;border-color:#ffffff1a}
.sw button{border-radius:99px;padding:8px 20px;font-size:14px;font-weight:500;color:var(--muted);transition:all .3s}
.sw button.on{background:var(--ink);color:var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.15)}
body.ai .sw button.on{background:#d9e1e4;color:#0f1316}

/* Hero */
.hero{padding:clamp(40px,10vh,120px) max(var(--pad),env(safe-area-inset-right))
      0 max(var(--pad),env(safe-area-inset-left));
      max-width:1560px;margin-inline:auto;position:relative}
.role{color:var(--green);font-size:clamp(14px,1.5vw,18px);font-weight:500;letter-spacing:.05em;text-transform:uppercase}
h1{font:600 clamp(40px,12vw,140px)/1.15 var(--serif);letter-spacing:-.03em;margin:16px 0 0;color:var(--ink)}
.ridge{position:relative;margin-top:clamp(20px,4vw,50px);overflow:hidden;height:clamp(100px,15vw,200px)}
.ridge svg{display:block;width:100%;height:100%}
.ridge path{fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke;opacity:.8}
.ridge .r1{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2.5s .2s cubic-bezier(.5,0,.2,1) forwards}
.ridge .r2{stroke:var(--green);opacity:.6;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 3s .6s cubic-bezier(.5,0,.2,1) forwards}
.sun{position:absolute;left:75.42%;top:20.91%;width:clamp(20px,3vw,48px);height:clamp(20px,3vw,48px);
     transform:translate(-50%,-50%);border:1.5px solid var(--green);border-radius:50%;
     opacity:0;animation:fi 1s 2.4s forwards;background:var(--bg)}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes fi{to{opacity:1}}

/* Index */
.idx{padding:clamp(40px,8vw,90px) max(var(--pad),env(safe-area-inset-right))
     clamp(60px,10vw,100px) max(var(--pad),env(safe-area-inset-left));
     max-width:1560px;margin-inline:auto}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:24px;
     padding:28px 0;border-bottom:1px solid var(--line);transition:all .4s ease}
@media(hover:hover){.row:hover{padding-left:24px;background:linear-gradient(90deg, rgba(47,93,80,.04), transparent)}}
.row-left{display:flex;flex-direction:column;gap:6px}
.row b{font:500 clamp(24px,3.5vw,40px)/1.3 var(--serif);color:var(--ink)}
.row span{color:var(--muted);font-size:16px;max-width:600px}
.row small{color:var(--green);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;flex:none}

/* Section page */
#pg{padding:30px max(var(--pad),env(safe-area-inset-right))
    clamp(60px,10vw,100px) max(var(--pad),env(safe-area-inset-left));
    max-width:1560px;margin-inline:auto;animation:up .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(20px)}}
.back{display:inline-block;margin-bottom:clamp(30px,5vw,50px);color:var(--muted);font-weight:500;padding:8px 0;transition:color .2s}
.back:hover{color:var(--green)}
.kind{color:var(--green);font-size:13px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;margin-bottom:12px;display:block}
#pg h2{font:600 clamp(36px,7vw,84px)/1.15 var(--serif);letter-spacing:-.02em}
.desc{color:var(--muted);max-width:600px;margin:16px 0 clamp(40px,8vw,70px);font-size:clamp(16px,2vw,20px)}

/* Gallery (wall) */
.gal{display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:clamp(20px,3vw,40px)}
.gal figure{display:flex;flex-direction:column;gap:16px;cursor:zoom-in;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
@media(hover:hover){.gal figure:hover{transform:translateY(-6px)}}
.gal .img-wrap{width:100%;aspect-ratio:4/5;overflow:hidden;background:var(--paper);border-radius:2px;position:relative}
.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
@media(hover:hover){.gal figure:hover img{transform:scale(1.04)}}
.ph{display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;
    width:100%;height:100%;font:600 24px/1.4 var(--serif);color:var(--ink);
    background:linear-gradient(135deg, hsl(150, 15%, 90%), hsl(150, 15%, 80%));}
.gal figcaption{font:600 20px/1.4 var(--serif);color:var(--ink)}
.gal figcaption small{display:block;font:400 15px/1.6 var(--sans);color:var(--muted);margin-top:4px}

/* Notes (notebook) */
.nt{max-width:740px;position:relative;padding-left:clamp(20px, 5vw, 60px)}
.nt::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--line)}
.nt article{position:relative;padding-bottom:clamp(30px,5vw,50px);margin-bottom:clamp(30px,5vw,50px);border-bottom:1px solid var(--line)}
.nt article::before{content:'';position:absolute;left:calc(-1 * clamp(20px, 5vw, 60px) - 5px);top:10px;width:10px;height:10px;background:var(--green);border-radius:50%;border:2px solid var(--bg)}
.nt h3{font:600 clamp(24px,3.5vw,32px)/1.3 var(--serif);margin-bottom:12px}
.nt p{line-height:2;color:#2c3236}
.nt img{width:100%;margin:20px 0;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.nt .l{display:inline-block;color:var(--green);font-weight:600;border-bottom:1px solid var(--green);margin:12px 20px 0 0;padding:2px 0}

/* Footer & Nav */
.nx{display:flex;justify-content:space-between;gap:20px;margin-top:clamp(50px,8vw,80px);color:var(--muted);flex-wrap:wrap;font-weight:500}
.nx a{display:flex;align-items:center;gap:8px;transition:color .2s}
.nx a:hover{color:var(--green)}
.ft{padding:40px max(var(--pad),env(safe-area-inset-right))
    max(40px,env(safe-area-inset-bottom)) max(var(--pad),env(safe-area-inset-left));
    max-width:1560px;margin-inline:auto;border-top:1px solid var(--line);
    display:flex;gap:24px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-weight:500}
.ft a:hover{color:var(--green)}

/* Lightbox */
#lb{position:fixed;inset:0;z-index:100;background:rgba(251,250,247,.95);backdrop-filter:blur(10px);
    display:none;align-items:center;justify-content:center;
    padding:max(20px,env(safe-area-inset-top)) 20px}
#lb.on{display:flex}
#lb .box{max-width:900px;max-height:100%;overflow:auto;padding:20px;text-align:center}
#lb img{max-width:100%;max-height:70vh;display:block;margin:0 auto 24px;border-radius:4px;box-shadow:0 20px 50px rgba(0,0,0,.1)}
#lb h3{font:600 clamp(24px,4vw,32px) var(--serif);margin-bottom:12px}
#lb p{color:var(--muted);max-width:600px;margin:0 auto 20px;font-size:16px}
#lb a{color:var(--green);font-weight:600;border-bottom:1px solid;padding:4px 0;display:inline-block}
#lb .x{position:absolute;top:max(20px,env(safe-area-inset-top));right:20px;
       width:48px;height:48px;font-size:24px;border-radius:50%;background:var(--paper);
       display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.05)}
#lb .ln{position:absolute;top:50%;width:56px;height:56px;margin-top:-28px;
        border-radius:50%;background:var(--bg);box-shadow:0 4px 20px rgba(0,0,0,.08);
        font-size:28px;display:flex;align-items:center;justify-content:center}
@media(hover:hover){#lb .ln:hover{background:var(--paper)}}
#lb .p{left:20px}#lb .n{right:20px}
@media(max-width:600px){
  #lb .ln{top:auto;bottom:max(20px,env(safe-area-inset-bottom));margin:0;width:48px;height:48px}
  #lb .p{left:20px}#lb .n{right:20px}
  #lb .box{padding-bottom:80px}
}

/* AI view */
.ai-in{max-width:820px;margin-inline:auto;
       padding:clamp(40px,10vh,100px) max(var(--pad),env(safe-area-inset-right))
              80px max(var(--pad),env(safe-area-inset-left));
       font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.8}
.ai-in .mn{color:#7fd1b0;margin-bottom:12px}
.ai-in h2{font:600 clamp(28px,5vw,44px)/1.3 var(--serif);margin:10px 0 24px;color:#fff}
.ai-in a{color:#7fd1b0;border-bottom:1px solid #7fd1b055;padding-bottom:2px}
.ai-in ul{list-style:none;padding:0;margin:24px 0}
.ai-in li{padding:6px 0}
.ai-in pre{background:#0a0d0f;border:1px solid #ffffff1c;border-radius:12px;
           padding:20px;overflow:auto;max-height:50vh;font-size:12.5px;margin-top:24px;color:#d9e1e4}
.cp{margin-top:16px;border:1px solid #7fd1b0;color:#7fd1b0;border-radius:99px;padding:10px 24px;transition:all .2s}
.cp:hover{background:#7fd1b01a}

@media(prefers-reduced-motion:reduce){
  .ridge .r1,.ridge .r2,.sun{animation:none;stroke-dashoffset:0;opacity:1}
  #pg{animation:none} *{scroll-behavior:auto!important}
}
</style>
</head>
<body>

<header class="hd">
  <a class="brand" id="brand" href="#"></a>
  <div class="sw" role="tablist" aria-label="ভিউ">
    <button data-view="" role="tab" aria-selected="true">মানুষ</button>
    <button data-view="ai" role="tab" aria-selected="false">এআই</button>
  </div>
</header>

<main id="human">
  <section class="hero">
    <p class="role" id="role"></p>
    <h1 id="ttl"></h1>
    <div class="ridge">
      <svg viewBox="0 0 1200 220" preserveAspectRatio="none" aria-hidden="true">
        <path class="r1" pathLength="1" d="M0 178C90 160 130 96 215 116S330 44 430 92 570 160 660 106 810 24 910 84 1090 166 1200 124"/>
        <path class="r2" pathLength="1" d="M0 200C110 186 170 140 260 152S420 110 520 146 700 186 790 150 980 96 1080 140 1160 170 1200 160"/>
      </svg>
      <span class="sun" aria-hidden="true"></span>
    </div>
  </section>
  <nav class="idx" id="idx" aria-label="সেকশন"></nav>
</main>

<section id="pg" hidden></section>

<section id="ai" hidden>
  <div class="ai-in">
    <p class="mn">// machine-readable profile</p>
    <h2 id="at"></h2>
    <p>এই সাইটের সম্পূর্ণ তথ্য মেশিনের জন্য কাঠামোবদ্ধ আকারে আছে। জাভাস্ক্রিপ্ট ছাড়াই পড়া যায়:</p>
    <ul>
      <li><a href="agent.json">agent.json</a> — structured profile (JSON)</li>
      <li><a href="llms.txt">llms.txt</a> — plain text summary</li>
      <li><a href="ai.html">ai.html</a> — static semantic page</li>
    </ul>
    <pre id="js"></pre>
    <button class="cp" id="cp">Copy JSON</button>
  </div>
</section>

<footer class="ft" id="ft">
  <a href="ai.html">For AI Agents</a>
  <a href="agent.json">agent.json</a>
  <a href="llms.txt">llms.txt</a>
</footer>

<div id="lb" role="dialog" aria-modal="true" aria-label="গ্যালারি"></div>

<noscript>
  <div style="max-width:700px;margin:40px auto;padding:20px">
    <h1>সুকেশ খীসা (Sukesh Khisa)</h1>
    <p>জাভাস্ক্রিপ্ট বন্ধ। মেশিন-রিডেবল সংস্করণ:</p>
    <ul>
      <li><a href="ai.html">ai.html</a></li>
      <li><a href="agent.json">agent.json</a></li>
      <li><a href="llms.txt">llms.txt</a></li>
    </ul>
  </div>
</noscript>

<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const br=s=>esc(s).replace(/\n/g,'<br>');

let D=null, L=null;

function renderGallery(s){
  return '<div class="gal">'+s.items.map((it,j)=>`
    <figure data-j="${j}" tabindex="0" role="button" aria-label="${esc(it.title)}">
      <div class="img-wrap">
        ${it.image?`<img loading="lazy" src="${esc(it.image)}" alt="${esc(it.title)}">`:`<div class="ph">${esc(it.title)}</div>`}
      </div>
      <figcaption>
        ${esc(it.title)}
        <small>${esc(String(it.text||'').slice(0,70))}</small>
      </figcaption>
    </figure>`).join('')+'</div>';
}

function renderNotes(s){
  return '<div class="nt">'+s.items.map(it=>`
    <article>
      <h3>${esc(it.title)}</h3>
      ${it.image?`<img loading="lazy" src="${esc(it.image)}" alt="${esc(it.title)}">`:''}
      <p>${br(it.text)}</p>
      ${it.link?`<a class="l" href="${esc(it.link)}" target="_blank" rel="noopener">লিংক দেখুন</a>`:''}
      ${it.file?`<a class="l" href="${esc(it.file)}" download>ফাইল ডাউনলোড</a>`:''}
    </article>`).join('')+'</div>';
}

function renderSection(s){
  const n=D.sections.length, i=D.sections.indexOf(s);
  const P=D.sections[(i+n-1)%n], X=D.sections[(i+1)%n];
  $('#pg').innerHTML=`
    <a class="back" href="#">← সূচিতে ফিরে যান</a>
    <span class="kind">${s.kind==='wall'?'দেয়াল':'খাতা'}</span>
    <h2>${esc(s.name)}</h2>
    <p class="desc">${esc(s.desc)}</p>
    ${s.kind==='wall'?renderGallery(s):renderNotes(s)}
    <nav class="nx">
      <a href="#${esc(P.id)}">← ${esc(P.name)}</a>
      <a href="#${esc(X.id)}">${esc(X.name)} →</a>
    </nav>`;
}

function openLB(items,i){
  L={items,i}; const it=items[i];
  $('#lb').innerHTML=`
    <button class="x" aria-label="বন্ধ">×</button>
    ${items.length>1?`
      <button class="ln p" data-n="-1" aria-label="আগের">‹</button>
      <button class="ln n" data-n="1" aria-label="পরের">›</button>`:''}
    <div class="box">
      ${it.image?`<img src="${esc(it.image)}" alt="${esc(it.title)}">`:''}
      <h3>${esc(it.title)}</h3>
      <p>${br(it.text)}</p>
      ${it.link?`<a href="${esc(it.link)}" target="_blank" rel="noopener">লিংক দেখুন</a>`:''}
      ${it.file?`<a href="${esc(it.file)}" download>ফাইল ডাউনলোড</a>`:''}
    </div>`;
  $('#lb').classList.add('on');
  document.body.style.overflow='hidden';
}

function closeLB(){
  $('#lb').classList.remove('on');
  document.body.style.overflow='';
  L=null;
}

function move(d){
  if(!L||L.items.length<2)return;
  openLB(L.items,(L.i+d+L.items.length)%L.items.length);
}

function route(){
  const h=location.hash.slice(1)||'';
  const isAI=h==='ai';
  const s=D.sections.find(x=>x.id===h);
  closeLB();
  document.body.classList.toggle('ai',isAI);
  $('#human').hidden=isAI||!!s;
  $('#pg').hidden=!s;
  $('#ai').hidden=!isAI;
  $('#ft').hidden=isAI;
  $$('.sw button').forEach(b=>{
    const on=(b.dataset.view==='ai')===isAI;
    b.classList.toggle('on',on);
    b.setAttribute('aria-selected',on?'true':'false');
  });
  if(s) renderSection(s);
  if(isAI) $('#js').textContent=JSON.stringify(D,null,1);
  window.scrollTo(0,0);
}

function buildIndex(){
  $('#idx').innerHTML=D.sections.map(s=>`
    <a class="row" href="#${esc(s.id)}">
      <div class="row-left">
        <b>${esc(s.name)}</b>
        <span>${esc(s.desc)}</span>
      </div>
      <small>${s.kind==='wall'?'দেয়াল':'খাতা'}</small>
    </a>`).join('');
}

async function boot(){
  try{
    const r=await fetch('content.json?v='+Date.now(),{cache:'no-cache'});
    if(r.ok) D=await r.json();
  }catch(e){}
  if(!D){ $('#human').innerHTML='<div style="padding:40px">content.json পাওয়া যায়নি। <a href="ai.html">ai.html</a> দেখুন।</div>'; return; }
  
  document.title=D.site.title+(D.site.en?' — '+D.site.en:'');
  $('#brand').textContent=D.site.title;
  $('#ttl').textContent=D.site.title;
  $('#role').textContent=D.site.role||D.site.tagline||'';
  $('#at').textContent=D.site.en?`${D.site.title} (${D.site.en})`:D.site.title;
  buildIndex();

  const ld=document.createElement('script');
  ld.type='application/ld+json';
  ld.textContent=JSON.stringify({
    '@context':'https://schema.org','@type':'Person',
    name:D.site.en||D.site.title, alternateName:D.site.title,
    jobTitle:D.site.role,
    address:{'@type':'PostalAddress',addressLocality:'Rangamati',addressCountry:'BD'}
  });
  document.head.appendChild(ld);

  const bot=navigator.webdriver||/bot|crawl|spider|gpt|claude|anthropic|perplexity|gemini|headless|agent|curl|wget|python/i.test(navigator.userAgent);
  if(!location.hash&&bot) location.hash='ai';
  route();
}

document.addEventListener('click',e=>{
  const t=e.target;
  const b=t.closest('.sw button');
  const f=t.closest('figure');
  if(b){ location.hash=b.dataset.view; return; }
  if(f){ const s=D.sections.find(x=>x.id===location.hash.slice(1)); if(s) openLB(s.items,+f.dataset.j); return; }
  if(t.id==='cp'){
    navigator.clipboard?.writeText($('#js').textContent);
    t.textContent='Copied!';
    setTimeout(()=>t.textContent='Copy JSON',1600);
    return;
  }
  if(t.closest('#lb .ln')){ move(+t.closest('.ln').dataset.n); return; }
  if(t.closest('#lb')&&!t.closest('.box')) closeLB();
  if(t.classList.contains('x')) closeLB();
});

addEventListener('keydown',e=>{
  if(e.key==='Escape') closeLB();
  if(L&&$('#lb').classList.contains('on')){
    if(e.key==='ArrowRight'){ e.preventDefault(); move(1); }
    if(e.key==='ArrowLeft'){ e.preventDefault(); move(-1); }
  }
  if(e.key==='Enter'&&e.target.tagName==='FIGURE') e.target.click();
});

let sx=0, sy=0;
$('#lb').addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
$('#lb').addEventListener('touchend',e=>{
  const dx=sx-e.changedTouches[0].clientX, dy=sy-e.changedTouches[0].clientY;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)) move(dx>0?1:-1);
},{passive:true});

addEventListener('hashchange',route);
boot();
</script>
</body>
