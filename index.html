<!doctype html>
<html lang="bn" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf9f6">
<title>সুকেশ খীসা — Sukesh Khisa</title>
<meta name="description" content="ইন্টার্ন সাংবাদিক ও ক্রিয়েটিভ প্রফেশনাল, রাঙামাটি।">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate" type="application/json" href="agent.json">
<link rel="alternate" type="text/markdown" href="llms.txt">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf9f6;
  --surface: #ffffff;
  --text: #111111;
  --text-muted: #555555;
  --accent: #b87333;
  --border: #e0e0e0;
  --font-serif: 'Tiro Bangla', Georgia, serif;
  --font-sans: 'Hind Siliguri', system-ui, sans-serif;
  --pad: clamp(20px, 6vw, 80px);
}
[data-theme="dark"] {
  --bg: #0d0d0d;
  --surface: #161616;
  --text: #f0f0f0;
  --text-muted: #a0a0a0;
  --accent: #d98c47;
  --border: #2a2a2a;
}
* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); font: 17px/1.8 var(--font-sans); min-height: 100dvh; transition: background 0.4s ease, color 0.4s ease; overflow-x: hidden; }
h1, h2, h3 { font-family: var(--font-serif); font-weight: 400; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.navbar { position: fixed; top: 0; width: 100%; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--border); transition: background 0.4s, border-color 0.4s; }
.nav-container { max-width: 1200px; margin: 0 auto; padding: 24px var(--pad); display: flex; justify-content: space-between; align-items: center; }
.brand { font-family: var(--font-serif); font-size: 24px; letter-spacing: -0.5px; }
.nav-links { display: flex; gap: 32px; align-items: center; font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
.nav-links a { color: var(--text-muted); transition: color 0.2s; position: relative; }
.nav-links a::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 1px; background: var(--accent); transition: width 0.3s; }
.nav-links a:hover { color: var(--text); }
.nav-links a:hover::after { width: 100%; }
.theme-toggle { border: 1px solid var(--border); padding: 8px 16px; border-radius: 99px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; }
.theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
@media(max-width: 850px) { .nav-links { display: none; } }
.hero { max-width: 1200px; margin: 0 auto; padding: clamp(140px, 25vh, 250px) var(--pad) 100px; text-align: center; }
.hero-role { font-family: var(--font-sans); color: var(--accent); font-weight: 600; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 30px; display: block; }
h1 { font-size: clamp(48px, 10vw, 120px); line-height: 1.1; letter-spacing: -2px; margin-bottom: 30px; }
.hero-tagline { font-family: var(--font-serif); font-size: clamp(20px, 3vw, 28px); color: var(--text-muted); max-width: 700px; margin: 0 auto; font-style: italic; }
.hero-divider { width: 1px; height: 80px; background: var(--border); margin: 60px auto 0; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 var(--pad) 100px; }
.section-block { padding: 100px 0; border-top: 1px solid var(--border); }
.section-header { margin-bottom: 60px; display: flex; align-items: baseline; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.section-title { font-size: clamp(36px, 5vw, 56px); letter-spacing: -1px; }
.section-desc { color: var(--text-muted); font-size: 16px; max-width: 400px; text-align: right; }
@media(max-width: 768px) { .section-header { flex-direction: column; } .section-desc { text-align: left; } }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 40px; }
.card { cursor: pointer; display: flex; flex-direction: column; }
.card-img-wrap { width: 100%; aspect-ratio: 4/5; background: var(--surface); border: 1px solid var(--border); position: relative; overflow: hidden; margin-bottom: 20px; transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
.card:hover .card-img-wrap { transform: translateY(-10px); box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1); }
.card-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s; }
.card:hover .card-img-wrap img { transform: scale(1.05); }
.card-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; background: linear-gradient(135deg, #1a1a1a, #333); color: #fff; position: relative; }
.card-placeholder::before { content: ''; position: absolute; inset: 15px; border: 1px solid rgba(255,255,255,0.2); }
.card-placeholder span { font-family: var(--font-serif); font-size: 28px; line-height: 1.4; z-index: 1; }
.card-placeholder small { font-family: var(--font-sans); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); margin-top: 16px; z-index: 1; }
.card-body { text-align: center; }
.card-title { font-size: 24px; margin-bottom: 8px; }
.card-text { color: var(--text-muted); font-size: 15px; line-height: 1.6; }
.notes-list { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--border); }
.note-item { display: grid; grid-template-columns: 300px 1fr; gap: 40px; padding: 40px 0; border-bottom: 1px solid var(--border); transition: background 0.3s; }
.note-item:hover { background: rgba(0,0,0,0.01); }
[data-theme="dark"] .note-item:hover { background: rgba(255,255,255,0.01); }
@media(max-width: 768px) { .note-item { grid-template-columns: 1fr; gap: 16px; } }
.note-title { font-size: 28px; color: var(--text); line-height: 1.3; }
.note-text { color: var(--text-muted); font-size: 16px; line-height: 1.8; white-space: pre-wrap; }
.note-link { display: inline-block; margin-top: 20px; color: var(--accent); font-weight: 500; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid transparent; transition: border 0.2s; }
.note-link:hover { border-color: var(--accent); }
.contact-section { max-width: 700px; margin: 0 auto; padding: 100px 0; }
.contact-header { text-align: center; margin-bottom: 60px; }
.contact-form { display: flex; flex-direction: column; gap: 32px; }
.form-group { position: relative; }
.form-group label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 8px; }
.form-group input, .form-group textarea { width: 100%; padding: 12px 0; border: none; border-bottom: 1px solid var(--border); background: transparent; color: var(--text); font: 18px var(--font-sans); transition: border-color 0.3s; }
.form-group input:focus, .form-group textarea:focus { border-bottom-color: var(--accent); outline: none; }
.form-group textarea { resize: vertical; min-height: 120px; }
.submit-btn { align-self: flex-start; background: var(--text); color: var(--bg); padding: 16px 40px; border-radius: 0; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; transition: background 0.3s, color 0.3s; }
.submit-btn:hover { background: var(--accent); color: #fff; }
.form-status { padding: 16px; font-size: 15px; font-weight: 500; display: none; text-align: center; border: 1px solid; }
.form-status.success { background: rgba(34, 197, 94, 0.05); color: #16a34a; border-color: #16a34a; display: block; }
.form-status.error { background: rgba(239, 68, 68, 0.05); color: #dc2626; border-color: #dc2626; display: block; }
footer { border-top: 1px solid var(--border); padding: 60px var(--pad); text-align: center; color: var(--text-muted); font-size: 14px; }
footer a { color: var(--text); margin: 0 16px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid transparent; }
footer a:hover { color: var(--accent); border-color: var(--accent); }
#lb { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; padding: 24px; }
#lb.on { display: flex; }
.lb-content { background: var(--surface); max-width: 900px; width: 100%; max-height: 90vh; overflow: auto; position: relative; border: 1px solid var(--border); animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
.lb-img { width: 100%; max-height: 65vh; object-fit: contain; background: #000; }
.lb-body { padding: clamp(30px, 6vw, 50px); }
.lb-title { font-size: 36px; margin-bottom: 20px; }
.lb-text { color: var(--text-muted); font-size: 18px; line-height: 1.8; white-space: pre-wrap; }
.lb-close { position: absolute; top: 20px; right: 20px; width: 44px; height: 44px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.3s; }
.lb-close:hover { transform: rotate(90deg); }
</style>
<!-- ✅ Include Forminit SDK -->
<script src="https://forminit.com/sdk/v1/forminit.js"></script>
</head>
<body>
<nav class="navbar">
  <div class="nav-container">
    <a class="brand" id="nav-brand" href="#">সুকেশ খীসা</a>
    <div class="nav-links" id="nav-links"></div>
    <button class="theme-toggle" onclick="toggleTheme()">
      <span id="theme-icon">🌙</span> <span id="theme-text">DARK</span>
    </button>
  </div>
</nav>
<header class="hero">
  <span class="hero-role" id="hero-role"></span>
  <h1 id="hero-title"></h1>
  <p class="hero-tagline" id="hero-tagline"></p>
  <div class="hero-divider"></div>
</header>
<main class="container" id="main-content"></main>
<section class="contact-section" id="contact">
  <div class="contact-header">
    <h2 class="section-title">যোগাযোগ</h2>
    <p class="section-desc" style="margin: 0 auto;">কাজ বা সহযোগিতার জন্য সরাসরি মেসেজ পাঠান।</p>
  </div>
  
  <!-- Your Form -->
  <form class="contact-form" id="contact-form" enctype="multipart/form-data">
    <div class="form-group">
      <label>আপনার নাম</label>
      <input type="text" name="fi-sender-fullName" placeholder="আপনার নাম লিখুন" required>
    </div>
    <div class="form-group">
      <label>ইমেইল ঠিকানা</label>
      <input type="email" name="fi-sender-email" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <label>মেসেজ</label>
      <textarea name="fi-text-message" placeholder="বিস্তারিত লিখুন..." required></textarea>
    </div>
    <button type="submit" class="submit-btn" id="submit-btn">মেসেজ পাঠান</button>
    <p id="form-status" class="form-status"></p>
  </form>
</section>
<footer>
  <p>© <span id="year"></span> সুকেশ খীসা. All rights reserved.</p>
  <div style="margin-top: 24px;">
    <a href="ai.html">AI Agents</a>
    <a href="agent.json">agent.json</a>
    <a href="llms.txt">llms.txt</a>
  </div>
</footer>
<div id="lb">
  <div class="lb-content" id="lb-content"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D = null;

// Theme Logic
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.theme = isDark ? 'light' : 'dark';
  updateThemeUI(!isDark);
}
function updateThemeUI(isDark) {
  $('#theme-icon').textContent = isDark ? '☀️' : '🌙';
  $('#theme-text').textContent = isDark ? 'LIGHT' : 'DARK';
}
if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
  document.documentElement.setAttribute('data-theme', 'dark');
  updateThemeUI(true);
} else {
  document.documentElement.setAttribute('data-theme', 'light');
  updateThemeUI(false);
}

// Sections Rendering
function renderSections() {
  let html = '';
  D.sections.forEach((sec) => {
    if (sec.id === 'contact') return; 
    html += `<section id="${esc(sec.id)}" class="section-block">`;
    html += `
      <div class="section-header">
        <h2 class="section-title">${esc(sec.name)}</h2>
        <p class="section-desc">${esc(sec.desc)}</p>
      </div>`;
    if (sec.kind === 'wall') {
      html += '<div class="grid">';
      sec.items.forEach((item, j) => {
        html += `
          <div class="card" onclick="openLB('${esc(sec.id)}', ${j})">
            <div class="card-img-wrap">
              ${item.image 
                ? `<img src="${esc(item.image)}" alt="${esc(item.title)}" loading="lazy">` 
                : `<div class="card-placeholder">
                     <span>${esc(item.title)}</span>
                     <small>${esc(sec.name)}</small>
                   </div>`}
            </div>
            <div class="card-body">
              <h3 class="card-title">${esc(item.title)}</h3>
              <p class="card-text">${esc(String(item.text||'').slice(0, 70))}...</p>
            </div>
          </div>`;
      });
      html += '</div>';
    } else {
      html += '<div class="notes-list">';
      sec.items.forEach(item => {
        html += `
          <div class="note-item">
            <div class="note-title">${esc(item.title)}</div>
            <div>
              <p class="note-text">${esc(item.text)}</p>
              ${item.link ? `<a href="${esc(item.link)}" target="_blank" class="note-link">লিংক দেখুন →</a>` : ''}
            </div>
          </div>`;
      });
      html += '</div>';
    }
    html += `</section>`;
  });
  $('#main-content').innerHTML = html;
}

// Lightbox
function openLB(secId, itemIndex) {
  const sec = D.sections.find(s => s.id === secId);
  const item = sec.items[itemIndex];
  $('#lb-content').innerHTML = `
    <button class="lb-close" onclick="closeLB()">×</button>
    ${item.image ? `<img src="${esc(item.image)}" class="lb-img">` : ''}
    <div class="lb-body">
      <h3 class="lb-title">${esc(item.title)}</h3>
      <p class="lb-text">${esc(item.text)}</p>
      ${item.link ? `<a href="${esc(item.link)}" target="_blank" class="note-link" style="margin-top:24px;">লিংক দেখুন →</a>` : ''}
    </div>`;
  $('#lb').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeLB() {
  $('#lb').classList.remove('on');
  document.body.style.overflow = '';
}
$('#lb').addEventListener('click', e => { if(e.target.id === 'lb') closeLB(); });

// ✅ Forminit Form Submission
const forminit = new Forminit();
const FORM_ID = "6vkq7zu2e7q";

document.getElementById("contact-form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const btn = document.getElementById('submit-btn');
  const status = document.getElementById('form-status');
  
  btn.disabled = true;
  btn.textContent = 'পাঠানো হচ্ছে...';
  status.className = 'form-status';
  status.textContent = '';

  const formData = new FormData(e.target);
  
  try {
    const { data, error } = await forminit.submit(FORM_ID, formData);

    if (error) {
      // Forminit থেকে আসা আসল এরর মেসেজটি স্ক্রিনে দেখানো হচ্ছে
      status.textContent = '❌ ' + (error.message || JSON.stringify(error));
      status.className = 'form-status error';
      return;
    }

    status.textContent = '✅ আপনার মেসেজ সফলভাবে পাঠানো হয়েছে!';
    status.className = 'form-status success';
    e.target.reset();
  } catch (err) {
    status.textContent = '❌ নেটওয়ার্ক এরর: ' + err.message;
    status.className = 'form-status error';
  } finally {
    btn.disabled = false;
    btn.textContent = 'মেসেজ পাঠান';
    setTimeout(() => { status.className = 'form-status'; }, 7000);
  }
});

async function boot() {
  try {
    const res = await fetch('content.json?v=' + Date.now());
    D = await res.json();
  } catch (e) {
    $('#main-content').innerHTML = '<p>ডেটা লোড করা যায়নি।</p>';
    return;
  }
  document.title = D.site.title + (D.site.en ? ' — ' + D.site.en : '');
  $('#nav-brand').textContent = D.site.title;
  $('#hero-title').textContent = D.site.title;
  $('#hero-role').textContent = D.site.role || '';
  $('#hero-tagline').textContent = D.site.tagline || '';
  $('#year').textContent = new Date().getFullYear();
  const navLinks = D.sections.map(s => {
    if (s.id === 'contact') return ''; 
    return `<a href="#${esc(s.id)}">${esc(s.name)}</a>`;
  }).join('');
  $('#nav-links').innerHTML = navLinks + '<a href="#contact">যোগাযোগ</a>';
  renderSections();
}
boot();
</script>
</body>
</html>
