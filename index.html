<!doctype html>
<html lang="bn" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>সুকেশ খীসা — Sukesh Khisa</title>
<meta name="description" content="ইন্টার্ন সাংবাদিক ও ক্রিয়েটিভ প্রফেশনাল, রাঙামাটি।">
<link rel="canonical" href="https://meghulo.netlify.app/">
<meta property="og:type" content="website">
<meta property="og:title" content="সুকেশ খীসা — Sukesh Khisa">
<meta property="og:description" content="ইন্টার্ন সাংবাদিক ও ক্রিয়েটিভ প্রফেশনাল, রাঙামাটি।">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="alternate" type="application/json" href="agent.json">
<link rel="alternate" type="text/markdown" href="llms.txt">
<!-- নতুন ফন্ট: Tiro Bangla (অভিজাত সেরিফ) এবং Inter (ক্লিন স্যান্স) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f1ea;
  --surface: #ffffff;
  --text: #1a1a1a;
  --text-muted: #555555;
  --accent: #c84b31;
  --border: #1a1a1a;
  --shadow: 6px 6px 0px #1a1a1a;
  --radius: 4px;
  --serif: 'Tiro Bangla', Georgia, serif;
  --sans: 'Inter', system-ui, sans-serif;
  --pad: clamp(20px, 5vw, 60px);
}

[data-theme="dark"] {
  --bg: #121212;
  --surface: #1e1e1e;
  --text: #f0f0f0;
  --text-muted: #a0a0a0;
  --accent: #e86a4e;
  --border: #f0f0f0;
  --shadow: 6px 6px 0px var(--accent);
}

* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); font: 16px/1.8 var(--sans); min-height: 100dvh; transition: background 0.3s, color 0.3s; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

/* Navbar */
.navbar { position: fixed; top: 0; width: 100%; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--border); transition: background 0.3s, border-color 0.3s; }
.nav-container { max-width: 1200px; margin: 0 auto; padding: 20px var(--pad); display: flex; justify-content: space-between; align-items: center; }
.brand { font: 400 24px var(--serif); letter-spacing: -0.5px; }
.nav-links { display: flex; gap: 32px; align-items: center; font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
.nav-links a { color: var(--text); position: relative; }
.nav-links a::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0%; height: 2px; background: var(--accent); transition: width 0.3s; }
.nav-links a:hover::after { width: 100%; }
.theme-toggle { border: 1px solid var(--border); padding: 8px 16px; border-radius: 99px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: all 0.2s; }
.theme-toggle:hover { background: var(--text); color: var(--bg); }
@media(max-width: 768px) { .nav-links { display: none; } }

/* Hero */
.hero { max-width: 1200px; margin: 0 auto; padding: clamp(140px, 20vh, 220px) var(--pad) 80px; border-bottom: 2px solid var(--border); }
.hero-role { color: var(--accent); font-weight: 600; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 24px; display: inline-block; border: 1px solid var(--accent); padding: 6px 16px; border-radius: 99px; }
h1 { font: 400 clamp(48px, 10vw, 120px)/1.1 var(--serif); letter-spacing: -2px; margin-bottom: 24px; }
.hero-tagline { font-size: clamp(18px, 2.5vw, 24px); color: var(--text-muted); max-width: 700px; font-style: italic; font-family: var(--serif); }

/* Sections Grid */
.container { max-width: 1200px; margin: 0 auto; padding: 60px var(--pad) 80px; }
.section-header { margin-bottom: 48px; display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
.section-title { font: 400 clamp(32px, 5vw, 48px) var(--serif); }
.section-desc { color: var(--text-muted); font-size: 16px; max-width: 400px; text-align: right; }
@media(max-width: 768px) { .section-header { flex-direction: column; gap: 12px; align-items: flex-start; } .section-desc { text-align: left; } }

/* Bento Grid Layout */
.bento-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; }
.bento-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s; cursor: pointer; position: relative; overflow: hidden; }
.bento-item:hover { transform: translate(-4px, -4px); box-shadow: var(--shadow); }
.bento-item.large { grid-column: span 8; }
.bento-item.small { grid-column: span 4; }
@media(max-width: 900px) { .bento-item.large, .bento-item.small { grid-column: span 12; } }

/* Note List (Editorial Style) */
.notes-list { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--border); }
.note-item { display: grid; grid-template-columns: 200px 1fr; gap: 24px; padding: 32px 0; border-bottom: 1px solid var(--border); transition: background 0.2s; }
.note-item:hover { background: rgba(0,0,0,0.02); }
[data-theme="dark"] .note-item:hover { background: rgba(255,255,255,0.02); }
@media(max-width: 600px) { .note-item { grid-template-columns: 1fr; gap: 8px; } }
.note-title { font: 600 24px var(--serif); color: var(--text); }
.note-text { color: var(--text-muted); font-size: 16px; line-height: 1.8; }
.note-link { display: inline-block; margin-top: 12px; color: var(--accent); font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--accent); }

/* Image Placeholders */
.card-img-wrap { width: 100%; aspect-ratio: 16/9; background: var(--bg); border: 1px solid var(--border); margin-bottom: 24px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.card-placeholder { font: 400 32px var(--serif); color: var(--accent); text-align: center; padding: 20px; opacity: 0.8; }
.card-title { font: 600 24px var(--serif); margin-bottom: 8px; }
.card-text { color: var(--text-muted); font-size: 15px; }

/* Contact Section */
.contact-section { max-width: 800px; margin: 0 auto 80px; padding: 0 var(--pad); }
.contact-form { background: var(--surface); padding: 40px; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 8px 8px 0px var(--border); }
.form-group { margin-bottom: 24px; }
.form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
.form-group input, .form-group textarea { width: 100%; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); font: inherit; transition: border-color 0.2s; }
.form-group input:focus, .form-group textarea:focus { border-color: var(--accent); outline: none; }
.submit-btn { background: var(--accent); color: #fff; padding: 16px 32px; border-radius: var(--radius); font-weight: 600; font-size: 16px; width: 100%; text-transform: uppercase; letter-spacing: 1px; transition: transform 0.2s; }
.submit-btn:hover { transform: translateY(-2px); }
.form-status { margin-top: 16px; padding: 16px; border-radius: var(--radius); text-align: center; font-weight: 500; display: none; }
.form-status.success { background: #dcfce7; color: #166534; display: block; }
.form-status.error { background: #fee2e2; color: #991b1b; display: block; }

/* Footer */
footer { border-top: 2px solid var(--border); padding: 60px var(--pad); text-align: center; color: var(--text-muted); font-size: 14px; }
footer a { color: var(--text); margin: 0 16px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid transparent; }
footer a:hover { border-color: var(--accent); color: var(--accent); }

/* Lightbox */
#lb { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.9); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 24px; }
#lb.on { display: flex; }
.lb-content { background: var(--surface); border-radius: var(--radius); max-width: 900px; width: 100%; max-height: 90vh; overflow: auto; position: relative; border: 1px solid var(--border); }
.lb-img { width: 100%; max-height: 60vh; object-fit: contain; background: #000; }
.lb-body { padding: 40px; }
.lb-title { font: 400 32px var(--serif); margin-bottom: 16px; }
.lb-text { color: var(--text-muted); font-size: 16px; line-height: 1.8; white-space: pre-wrap; }
.lb-close { position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s; }
.lb-close:hover { transform: rotate(90deg); }
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a class="brand" id="nav-brand" href="#">সুকেশ খীসা</a>
    <div class="nav-links" id="nav-links"></div>
    <button class="theme-toggle" onclick="toggleTheme()">
      <span id="theme-icon">🌙</span> <span id="theme-text">DARK</span>
    </button>
  </div>
</nav>

<header class="hero">
  <span class="hero-role" id="hero-role"></span>
  <h1 id="hero-title"></h1>
  <p class="hero-tagline" id="hero-tagline"></p>
</header>

<main class="container" id="main-content">
  <!-- Dynamic Content -->
</main>

<!-- Contact Form Section -->
<section class="contact-section" id="contact">
  <div class="section-header">
    <h2 class="section-title">যোগাযোগ করুন</h2>
    <p class="section-desc">কোনো কাজ, সহযোগিতা বা মতামত জানাতে চাইলে নিচের ফর্মটি পূরণ করুন।</p>
  </div>
  <form class="contact-form" id="contact-form" name="contact" method="POST" data-netlify="true">
    <input type="hidden" name="form-name" value="contact">
    <div class="form-group">
      <label>আপনার নাম</label>
      <input type="text" name="name" required placeholder="আপনার পূর্ণ নাম">
    </div>
    <div class="form-group">
      <label>ইমেইল ঠিকানা</label>
      <input type="email" name="email" required placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>মেসেজ</label>
      <textarea name="message" rows="5" required placeholder="আপনার মেসেজটি এখানে লিখুন..."></textarea>
    </div>
    <button type="submit" class="submit-btn" id="submit-btn">মেসেজ পাঠান</button>
    <div id="form-status" class="form-status"></div>
  </form>
</section>

<footer>
  <p>© <span id="year"></span> সুকেশ খীসা. All rights reserved.</p>
  <div style="margin-top: 24px;">
    <a href="ai.html">For AI Agents</a>
    <a href="agent.json">agent.json</a>
    <a href="llms.txt">llms.txt</a>
  </div>
</footer>

<!-- ✅ Netlify Form Detection Blueprint (লুকানো ফর্ম) -->
<form name="contact" data-netlify="true" hidden>
  <input type="hidden" name="form-name" value="contact" />
  <input type="text" name="name" />
  <input type="email" name="email" />
  <textarea name="message"></textarea>
</form>

<div id="lb">
  <div class="lb-content" id="lb-content"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D = null;

// Theme Logic
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.theme = isDark ? 'light' : 'dark';
  updateThemeUI(!isDark);
}
function updateThemeUI(isDark) {
  $('#theme-icon').textContent = isDark ? '☀️' : '🌙';
  $('#theme-text').textContent = isDark ? 'LIGHT' : 'DARK';
}
if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
  document.documentElement.setAttribute('data-theme', 'dark');
  updateThemeUI(true);
} else {
  document.documentElement.setAttribute('data-theme', 'light');
  updateThemeUI(false);
}

// Sections Rendering (Bento Grid & Editorial)
function renderSections() {
  let html = '';
  D.sections.forEach((sec, idx) => {
    if (sec.id === 'contact') return; // স্কিপ কন্টাক্ট সেকশন
    
    html += `<section id="${esc(sec.id)}" style="margin-bottom: 80px;">`;
    html += `
      <div class="section-header">
        <h2 class="section-title">${esc(sec.name)}</h2>
        <p class="section-desc">${esc(sec.desc)}</p>
      </div>`;
    
    if (sec.kind === 'wall') {
      html += '<div class="bento-grid">';
      sec.items.forEach((item, j) => {
        // অল্টারনেটিং বেন্টো গ্রিড সাইজ
        const sizeClass = (j % 3 === 0) ? 'large' : 'small';
        html += `
          <div class="bento-item ${sizeClass}" onclick="openLB('${esc(sec.id)}', ${j})">
            <div class="card-img-wrap">
              ${item.image ? `<img src="${esc(item.image)}" alt="${esc(item.title)}" loading="lazy">` : `<div class="card-placeholder">${esc(item.title)}</div>`}
            </div>
            <div>
              <h3 class="card-title">${esc(item.title)}</h3>
              <p class="card-text">${esc(String(item.text||'').slice(0, 90))}...</p>
            </div>
          </div>`;
      });
      html += '</div>';
    } else {
      html += '<div class="notes-list">';
      sec.items.forEach(item => {
        html += `
          <div class="note-item">
            <div class="note-title">${esc(item.title)}</div>
            <div>
              <p class="note-text">${esc(item.text)}</p>
              ${item.link ? `<a href="${esc(item.link)}" target="_blank" class="note-link">লিংক দেখুন →</a>` : ''}
            </div>
          </div>`;
      });
      html += '</div>';
    }
    html += `</section>`;
  });
  $('#main-content').innerHTML = html;
}

// Lightbox
function openLB(secId, itemIndex) {
  const sec = D.sections.find(s => s.id === secId);
  const item = sec.items[itemIndex];
  $('#lb-content').innerHTML = `
    <button class="lb-close" onclick="closeLB()">×</button>
    ${item.image ? `<img src="${esc(item.image)}" class="lb-img">` : ''}
    <div class="lb-body">
      <h3 class="lb-title">${esc(item.title)}</h3>
      <p class="lb-text">${esc(item.text)}</p>
      ${item.link ? `<a href="${esc(item.link)}" target="_blank" class="note-link" style="margin-top:24px;">লিংক দেখুন →</a>` : ''}
    </div>`;
  $('#lb').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeLB() {
  $('#lb').classList.remove('on');
  document.body.style.overflow = '';
}
$('#lb').addEventListener('click', e => { if(e.target.id === 'lb') closeLB(); });

// ✅ Contact Form Submission (Netlify)
$('#contact-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#submit-btn');
  const status = $('#form-status');
  btn.disabled = true;
  btn.textContent = 'পাঠানো হচ্ছে...';
  status.className = 'form-status';
  status.textContent = '';

  const formData = new FormData(e.target);
  const data = new URLSearchParams(formData).toString();

  try {
    const res = await fetch('/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: data
    });
    
    if (res.ok) {
      status.textContent = '✅ আপনার মেসেজ সফলভাবে পাঠানো হয়েছে!';
      status.className = 'form-status success';
      e.target.reset();
    } else {
      throw new Error('Failed with status: ' + res.status);
    }
  } catch (err) {
    status.textContent = '❌ দুঃখিত, মেসেজ পাঠানো সম্ভব হয়নি। পরে আবার চেষ্টা করুন।';
    status.className = 'form-status error';
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = 'মেসেজ পাঠান';
    setTimeout(() => { status.className = 'form-status'; }, 5000);
  }
});

async function boot() {
  try {
    const res = await fetch('content.json?v=' + Date.now());
    D = await res.json();
  } catch (e) {
    $('#main-content').innerHTML = '<p>ডেটা লোড করা যায়নি। অনুগ্রহ করে পরে আবার চেষ্টা করুন।</p>';
    return;
  }

  document.title = D.site.title + (D.site.en ? ' — ' + D.site.en : '');
  $('#nav-brand').textContent = D.site.title;
  $('#hero-title').textContent = D.site.title;
  $('#hero-role').textContent = D.site.role || '';
  $('#hero-tagline').textContent = D.site.tagline || '';
  $('#year').textContent = new Date().getFullYear();

  const navLinks = D.sections.map(s => {
    if (s.id === 'contact') return ''; 
    return `<a href="#${esc(s.id)}">${esc(s.name)}</a>`;
  }).join('');
  $('#nav-links').innerHTML = navLinks + '<a href="#contact">যোগাযোগ</a>';

  renderSections();
}
boot();
</script>
</body>
</html>
