<!doctype html>
<html lang="bn" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>সুকেশ খীসা — Sukesh Khisa</title>
<meta name="description" content="ইন্টার্ন সাংবাদিক ও ক্রিয়েটিভ প্রফেশনাল, রাঙামাটি।">
<link rel="canonical" href="https://meghulo.netlify.app/">
<meta property="og:type" content="website">
<meta property="og:title" content="সুকেশ খীসা — Sukesh Khisa">
<meta property="og:description" content="ইন্টার্ন সাংবাদিক ও ক্রিয়েটিভ প্রফেশনাল, রাঙামাটি।">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="alternate" type="application/json" href="agent.json">
<link rel="alternate" type="text/markdown" href="llms.txt">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --text: #0f172a;
  --text-muted: #475569;
  --accent: #0d9488;
  --accent-hover: #0f766e;
  --border: #e2e8f0;
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
  --serif: 'Noto Serif Bengali', Georgia, serif;
  --sans: 'Hind Siliguri', system-ui, sans-serif;
  --radius: 16px;
  --pad: clamp(20px, 5vw, 60px);
}

[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1e293b;
  --text: #f8fafc;
  --text-muted: #94a3b8;
  --accent: #2dd4bf;
  --accent-hover: #5eead4;
  --border: #334155;
}

* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); font: 17px/1.7 var(--sans); min-height: 100dvh; transition: background 0.3s, color 0.3s; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

/* Navbar */
.navbar { position: fixed; top: 0; width: 100%; z-index: 50; background: rgba(var(--bg), 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); transition: background 0.3s, border-color 0.3s; }
.nav-container { max-width: 1200px; margin: 0 auto; padding: 16px var(--pad); display: flex; justify-content: space-between; align-items: center; }
.brand { font: 600 20px var(--serif); letter-spacing: 0.5px; }
.nav-links { display: flex; gap: 24px; align-items: center; font-size: 15px; font-weight: 500; }
.nav-links a { color: var(--text-muted); transition: color 0.2s; }
.nav-links a:hover { color: var(--accent); }
.theme-toggle { background: var(--surface); border: 1px solid var(--border); padding: 6px 12px; border-radius: 99px; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.theme-toggle:hover { background: var(--border); }
@media(max-width: 768px) { .nav-links { display: none; } }

/* Hero */
.hero { max-width: 1200px; margin: 0 auto; padding: clamp(120px, 18vh, 200px) var(--pad) 80px; }
.hero-role { color: var(--accent); font-weight: 600; font-size: clamp(14px, 1.5vw, 18px); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px; display: block; }
h1 { font: 700 clamp(40px, 8vw, 90px)/1.1 var(--serif); letter-spacing: -1px; }
.hero-tagline { font-size: clamp(18px, 2.5vw, 24px); color: var(--text-muted); margin-top: 20px; max-width: 600px; }

/* Sections Grid */
.container { max-width: 1200px; margin: 0 auto; padding: 0 var(--pad) 80px; }
.section-title { font: 600 clamp(28px, 4vw, 40px) var(--serif); margin-bottom: 8px; }
.section-desc { color: var(--text-muted); margin-bottom: 32px; font-size: 18px; }
.divider { height: 1px; background: var(--border); margin: 60px 0; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }

/* Cards (Wall) */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; display: flex; flex-direction: column; }
.card:hover { transform: translateY(-5px); box-shadow: var(--shadow-hover); }
.card-img-wrap { width: 100%; aspect-ratio: 16/10; background: var(--border); position: relative; overflow: hidden; }
.card-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
.card:hover .card-img-wrap img { transform: scale(1.05); }
.card-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; font: 600 24px var(--serif); color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.2); background: linear-gradient(135deg, var(--accent), var(--accent-hover)); }
.card-body { padding: 24px; flex: 1; display: flex; flex-direction: column; }
.card-title { font: 600 22px var(--serif); margin-bottom: 8px; }
.card-text { color: var(--text-muted); font-size: 15px; flex: 1; }

/* Notes (Notebook) */
.notes-list { display: flex; flex-direction: column; gap: 16px; }
.note-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); transition: transform 0.2s; }
.note-item:hover { transform: translateX(5px); border-color: var(--accent); }
.note-title { font: 600 22px var(--serif); margin-bottom: 8px; color: var(--accent); }
.note-text { color: var(--text); line-height: 1.8; white-space: pre-wrap; }
.note-link { display: inline-block; margin-top: 12px; color: var(--accent); font-weight: 600; border-bottom: 1px solid transparent; }
.note-link:hover { border-color: var(--accent); }

/* Contact Section */
.contact-section { max-width: 800px; margin: 0 auto 80px; padding: 0 var(--pad); }
.contact-form { background: var(--surface); padding: 32px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text); }
.form-group input, .form-group textarea { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; transition: border-color 0.2s; }
.form-group input:focus, .form-group textarea:focus { border-color: var(--accent); outline: none; }
.submit-btn { background: var(--accent); color: #fff; padding: 14px 28px; border-radius: 8px; font-weight: 600; font-size: 16px; width: 100%; transition: background 0.2s; }
.submit-btn:hover { background: var(--accent-hover); }
.form-status { margin-top: 16px; padding: 12px; border-radius: 8px; text-align: center; display: none; }
.form-status.success { background: #dcfce7; color: #166534; display: block; }
.form-status.error { background: #fee2e2; color: #991b1b; display: block; }

/* Footer */
footer { border-top: 1px solid var(--border); padding: 40px var(--pad); text-align: center; color: var(--text-muted); font-size: 14px; }
footer a { color: var(--accent); margin: 0 10px; }
footer a:hover { text-decoration: underline; }

/* Lightbox */
#lb { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; padding: 20px; }
#lb.on { display: flex; }
.lb-content { background: var(--surface); border-radius: var(--radius); max-width: 800px; width: 100%; max-height: 90vh; overflow: auto; position: relative; }
.lb-img { width: 100%; max-height: 60vh; object-fit: contain; background: #000; }
.lb-body { padding: 32px; }
.lb-title { font: 600 28px var(--serif); margin-bottom: 12px; }
.lb-text { color: var(--text-muted); font-size: 16px; line-height: 1.8; white-space: pre-wrap; }
.lb-close { position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.5); color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; }
.lb-close:hover { background: rgba(0,0,0,0.8); }
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a class="brand" id="nav-brand" href="#">সুকেশ খীসা</a>
    <div class="nav-links" id="nav-links"></div>
    <button class="theme-toggle" onclick="toggleTheme()">
      <span id="theme-icon">🌙</span> <span id="theme-text">ডার্ক</span>
    </button>
  </div>
</nav>

<header class="hero">
  <span class="hero-role" id="hero-role"></span>
  <h1 id="hero-title"></h1>
  <p class="hero-tagline" id="hero-tagline"></p>
</header>

<main class="container" id="main-content">
  <!-- Dynamic Content -->
</main>

<!-- Contact Form Section -->
<section class="contact-section" id="contact">
  <h2 class="section-title">যোগাযোগ করুন</h2>
  <p class="section-desc">কোনো কাজ, সহযোগিতা বা মতামত জানাতে চাইলে নিচের ফর্মটি পূরণ করুন।</p>
  <form class="contact-form" id="contact-form" name="contact" method="POST" data-netlify="true">
    <input type="hidden" name="form-name" value="contact">
    <div class="form-group">
      <label>আপনার নাম</label>
      <input type="text" name="name" required placeholder="আপনার পূর্ণ নাম">
    </div>
    <div class="form-group">
      <label>ইমেইল ঠিকানা</label>
      <input type="email" name="email" required placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>মেসেজ</label>
      <textarea name="message" rows="5" required placeholder="আপনার মেসেজটি এখানে লিখুন..."></textarea>
    </div>
    <button type="submit" class="submit-btn" id="submit-btn">মেসেজ পাঠান</button>
    <div id="form-status" class="form-status"></div>
  </form>
</section>

<footer>
  <p>© <span id="year"></span> সুকেশ খীসা. All rights reserved.</p>
  <div style="margin-top: 12px;">
    <a href="ai.html">For AI Agents</a>
    <a href="agent.json">agent.json</a>
    <a href="llms.txt">llms.txt</a>
  </div>
</footer>

<div id="lb">
  <div class="lb-content" id="lb-content"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D = null;

// Theme Logic
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.theme = isDark ? 'light' : 'dark';
  updateThemeUI(!isDark);
}
function updateThemeUI(isDark) {
  $('#theme-icon').textContent = isDark ? '☀️' : '🌙';
  $('#theme-text').textContent = isDark ? 'লাইট' : 'ডার্ক';
}
if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
  document.documentElement.setAttribute('data-theme', 'dark');
  updateThemeUI(true);
} else {
  document.documentElement.setAttribute('data-theme', 'light');
  updateThemeUI(false);
}

function renderSections() {
  let html = '';
  D.sections.forEach((sec, idx) => {
    if (idx > 0) html += '<div class="divider"></div>';
    html += `<section id="${esc(sec.id)}">`;
    html += `<h2 class="section-title">${esc(sec.name)}</h2>`;
    html += `<p class="section-desc">${esc(sec.desc)}</p>`;
    
    if (sec.kind === 'wall') {
      html += '<div class="grid">';
      sec.items.forEach((item, j) => {
        html += `
          <div class="card" onclick="openLB('${esc(sec.id)}', ${j})">
            <div class="card-img-wrap">
              ${item.image ? `<img src="${esc(item.image)}" alt="${esc(item.title)}" loading="lazy">` : `<div class="card-placeholder">${esc(item.title)}</div>`}
            </div>
            <div class="card-body">
              <h3 class="card-title">${esc(item.title)}</h3>
              <p class="card-text">${esc(String(item.text||'').slice(0, 80))}...</p>
            </div>
          </div>`;
      });
      html += '</div>';
    } else {
      html += '<div class="notes-list">';
      sec.items.forEach(item => {
        html += `
          <div class="note-item">
            <h3 class="note-title">${esc(item.title)}</h3>
            <p class="note-text">${esc(item.text)}</p>
            ${item.link ? `<a href="${esc(item.link)}" target="_blank" class="note-link">লিংক দেখুন →</a>` : ''}
          </div>`;
      });
      html += '</div>';
    }
    html += `</section>`;
  });
  $('#main-content').innerHTML = html;
}

function openLB(secId, itemIndex) {
  const sec = D.sections.find(s => s.id === secId);
  const item = sec.items[itemIndex];
  $('#lb-content').innerHTML = `
    <button class="lb-close" onclick="closeLB()">×</button>
    ${item.image ? `<img src="${esc(item.image)}" class="lb-img">` : ''}
    <div class="lb-body">
      <h3 class="lb-title">${esc(item.title)}</h3>
      <p class="lb-text">${esc(item.text)}</p>
      ${item.link ? `<a href="${esc(item.link)}" target="_blank" class="note-link" style="margin-top:16px;">লিংক দেখুন →</a>` : ''}
    </div>`;
  $('#lb').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeLB() {
  $('#lb').classList.remove('on');
  document.body.style.overflow = '';
}
$('#lb').addEventListener('click', e => { if(e.target.id === 'lb') closeLB(); });

// ✅ Contact Form Submission (Netlify)
$('#contact-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#submit-btn');
  const status = $('#form-status');
  btn.disabled = true;
  btn.textContent = 'পাঠানো হচ্ছে...';
  status.className = 'form-status';
  status.textContent = '';

  const formData = new FormData(e.target);
  const data = new URLSearchParams(formData).toString();

  try {
    const res = await fetch('/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: data
    });
    if (res.ok) {
      status.textContent = '✅ আপনার মেসেজ সফলভাবে পাঠানো হয়েছে!';
      status.className = 'form-status success';
      e.target.reset();
    } else {
      throw new Error('Failed');
    }
  } catch (err) {
    status.textContent = '❌ দুঃখিত, মেসেজ পাঠানো সম্ভব হয়নি। পরে আবার চেষ্টা করুন।';
    status.className = 'form-status error';
  } finally {
    btn.disabled = false;
    btn.textContent = 'মেসেজ পাঠান';
    setTimeout(() => { status.className = 'form-status'; }, 5000);
  }
});

async function boot() {
  try {
    const res = await fetch('content.json?v=' + Date.now());
    D = await res.json();
  } catch (e) {
    $('#main-content').innerHTML = '<p>ডেটা লোড করা যায়নি। অনুগ্রহ করে পরে আবার চেষ্টা করুন।</p>';
    return;
  }

  document.title = D.site.title + (D.site.en ? ' — ' + D.site.en : '');
  $('#nav-brand').textContent = D.site.title;
  $('#hero-title').textContent = D.site.title;
  $('#hero-role').textContent = D.site.role || '';
  $('#hero-tagline').textContent = D.site.tagline || '';
  $('#year').textContent = new Date().getFullYear();

  // ✅ নেভিগেশন লিংক তৈরি (শুধু একবার "যোগাযোগ" যোগ হবে)
  const navLinks = D.sections.map(s => {
    if (s.id === 'contact') return ''; // content.json-এ থাকা "যোগাযোগ" সেকশন বাদ
    return `<a href="#${esc(s.id)}">${esc(s.name)}</a>`;
  }).join('');
  $('#nav-links').innerHTML = navLinks + '<a href="#contact">যোগাযোগ</a>';

  renderSections();
}
boot();
</script>
</body>
</html>
