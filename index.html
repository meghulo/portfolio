<!doctype html>
<html lang="bn" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>সুকেশ খীসা — Sukesh Khisa</title>
<meta name="description" content="ইন্টার্ন সাংবাদিক ও ক্রিয়েটিভ প্রফেশনাল, রাঙামাটি।">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate" type="application/json" href="agent.json">
<link rel="alternate" type="text/markdown" href="llms.txt">
<!-- নতুন ফন্ট: Noto Serif Bengali (হেডিংয়ের জন্য) এবং Inter (বডি টেক্সটের জন্য) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf9f7;
  --surface: #ffffff;
  --text: #111111;
  --text-muted: #666666;
  --accent: #2d5a4c; /* মার্জিত সবুজ */
  --border: #e5e5e5;
  --radius: 12px;
  --font-serif: 'Noto Serif Bengali', Georgia, serif;
  --font-sans: 'Inter', system-ui, sans-serif;
  --pad: clamp(20px, 5vw, 60px);
}

[data-theme="dark"] {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --text: #f5f5f5;
  --text-muted: #999999;
  --accent: #7fb8a4;
  --border: #2a2a2a;
}

* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); font: 17px/1.7 var(--font-sans); min-height: 100dvh; transition: background 0.3s, color 0.3s; overflow-x: hidden; }
h1, h2, h3 { font-family: var(--font-serif); font-weight: 500; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

/* Navbar */
.navbar { position: fixed; top: 0; width: 100%; z-index: 50; background: rgba(var(--bg), 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); transition: background 0.3s, border-color 0.3s; }
.nav-container { max-width: 1100px; margin: 0 auto; padding: 20px var(--pad); display: flex; justify-content: space-between; align-items: center; }
.brand { font-family: var(--font-serif); font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
.nav-links { display: flex; gap: 24px; align-items: center; font-size: 15px; font-weight: 500; }
.nav-links a { color: var(--text-muted); transition: color 0.2s; }
.nav-links a:hover { color: var(--text); }
.theme-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
.theme-toggle:hover { color: var(--text); }
@media(max-width: 850px) { .nav-links { display: none; } }

/* Hero */
.hero { max-width: 1000px; margin: 0 auto; padding: clamp(120px, 20vh, 200px) var(--pad) 80px; text-align: center; border-bottom: 1px solid var(--border); }
.hero-role { color: var(--accent); font-weight: 600; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 24px; display: inline-block; }
h1 { font-size: clamp(36px, 6vw, 64px); line-height: 1.3; margin-bottom: 24px; letter-spacing: -1px; }
.hero-tagline { font-size: clamp(18px, 2vw, 22px); color: var(--text-muted); max-width: 600px; margin: 0 auto; font-family: var(--font-serif); }

/* Sections */
.container { max-width: 1000px; margin: 0 auto; padding: 0 var(--pad) 80px; }
.section-block { padding: 80px 0; border-bottom: 1px solid var(--border); }
.section-header { margin-bottom: 48px; }
.section-title { font-size: clamp(28px, 4vw, 40px); margin-bottom: 12px; }
.section-desc { color: var(--text-muted); font-size: 17px; }

/* Gallery Grid (Clean & Minimal) */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 32px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; display: flex; flex-direction: column; }
.card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -10px rgba(0,0,0,0.05); }
.card-img-wrap { width: 100%; aspect-ratio: 16/9; background: var(--bg); position: relative; overflow: hidden; border-bottom: 1px solid var(--border); }
.card-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
.card:hover .card-img-wrap img { transform: scale(1.03); }
/* ছবি না থাকলে সুন্দর মিনিমাল প্লেসহোল্ডার */
.card-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; font: 500 20px var(--font-serif); color: var(--text-muted); background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.02) 10px, rgba(0,0,0,0.02) 20px); }
.card-body { padding: 24px; flex: 1; display: flex; flex-direction: column; }
.card-title { font-size: 20px; margin-bottom: 8px; }
.card-text { color: var(--text-muted); font-size: 15px; flex: 1; line-height: 1.6; }

/* Notebook List (Editorial) */
.notes-list { display: flex; flex-direction: column; gap: 24px; }
.note-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; transition: border-color 0.3s; }
.note-item:hover { border-color: var(--accent); }
.note-title { font-size: 22px; margin-bottom: 12px; color: var(--accent); }
.note-text { color: var(--text-muted); line-height: 1.8; font-size: 16px; white-space: pre-wrap; }
.note-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; color: var(--text); font-weight: 500; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--text); padding-bottom: 2px; }
.note-link:hover { color: var(--accent); border-color: var(--accent); }

/* Contact Form */
.contact-section { max-width: 700px; margin: 0 auto; padding: 80px 0; }
.contact-form { background: var(--surface); padding: clamp(24px, 5vw, 48px); border-radius: var(--radius); border: 1px solid var(--border); }
.form-group { margin-bottom: 24px; }
.form-group label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; color: var(--text); }
.form-group input, .form-group textarea { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; transition: border-color 0.2s; }
.form-group input:focus, .form-group textarea:focus { border-color: var(--accent); outline: none; }
.submit-btn { background: var(--text); color: var(--bg); padding: 16px 32px; border-radius: 8px; font-weight: 600; font-size: 16px; width: 100%; transition: opacity 0.2s; }
.submit-btn:hover { opacity: 0.8; }
.form-status { margin-top: 20px; padding: 16px; border-radius: 8px; text-align: center; font-weight: 500; display: none; font-size: 15px; }
.form-status.success { background: rgba(34, 197, 94, 0.1); color: #16a34a; display: block; }
.form-status.error { background: rgba(239, 68, 68, 0.1); color: #dc2626; display: block; }

/* Footer */
footer { border-top: 1px solid var(--border); padding: 40px var(--pad); text-align: center; color: var(--text-muted); font-size: 14px; }
footer a { color: var(--text); margin: 0 12px; font-weight: 500; transition: color 0.2s; }
footer a:hover { color: var(--accent); }

/* Lightbox */
#lb { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 24px; }
#lb.on { display: flex; }
.lb-content { background: var(--surface); border-radius: var(--radius); max-width: 800px; width: 100%; max-height: 90vh; overflow: auto; position: relative; border: 1px solid var(--border); }
.lb-img { width: 100%; max-height: 60vh; object-fit: contain; background: #000; }
.lb-body { padding: clamp(24px, 5vw, 40px); }
.lb-title { font-size: 28px; margin-bottom: 16px; }
.lb-text { color: var(--text-muted); font-size: 16px; line-height: 1.8; white-space: pre-wrap; }
.lb-close { position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a class="brand" id="nav-brand" href="#">সুকেশ খীসা</a>
    <div class="nav-links" id="nav-links"></div>
    <button class="theme-toggle" onclick="toggleTheme()">
      <span id="theme-icon">🌙</span> <span id="theme-text">DARK</span>
    </button>
  </div>
</nav>

<header class="hero">
  <span class="hero-role" id="hero-role"></span>
  <h1 id="hero-title"></h1>
  <p class="hero-tagline" id="hero-tagline"></p>
</header>

<main class="container" id="main-content">
  <!-- Dynamic Content -->
</main>

<!-- Contact Form Section -->
<section class="contact-section" id="contact">
  <div class="section-header" style="text-align: center;">
    <h2 class="section-title">যোগাযোগ করুন</h2>
    <p class="section-desc">কোনো কাজ, সহযোগিতা বা মতামত জানাতে চাইলে নিচের ফর্মটি পূরণ করুন।</p>
  </div>
  
  <!-- FormSubmit.co Integration -->
  <form class="contact-form" id="contact-form">
    <div class="form-group">
      <label>আপনার নাম</label>
      <input type="text" name="name" required placeholder="আপনার পূর্ণ নাম">
    </div>
    <div class="form-group">
      <label>ইমেইল ঠিকানা</label>
      <input type="email" name="email" required placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>মেসেজ</label>
      <textarea name="message" rows="5" required placeholder="আপনার মেসেজটি এখানে লিখুন..."></textarea>
    </div>
    <button type="submit" class="submit-btn" id="submit-btn">মেসেজ পাঠান</button>
    <div id="form-status" class="form-status"></div>
  </form>
</section>

<footer>
  <p>© <span id="year"></span> সুকেশ খীসা. All rights reserved.</p>
  <div style="margin-top: 20px;">
    <a href="ai.html">For AI Agents</a>
    <a href="agent.json">agent.json</a>
    <a href="llms.txt">llms.txt</a>
  </div>
</footer>

<div id="lb">
  <div class="lb-content" id="lb-content"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D = null;

// Theme Logic
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.theme = isDark ? 'light' : 'dark';
  updateThemeUI(!isDark);
}
function updateThemeUI(isDark) {
  $('#theme-icon').textContent = isDark ? '☀️' : '🌙';
  $('#theme-text').textContent = isDark ? 'LIGHT' : 'DARK';
}
if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
  document.documentElement.setAttribute('data-theme', 'dark');
  updateThemeUI(true);
} else {
  document.documentElement.setAttribute('data-theme', 'light');
  updateThemeUI(false);
}

// Sections Rendering
function renderSections() {
  let html = '';
  D.sections.forEach((sec) => {
    if (sec.id === 'contact') return; 
    
    html += `<section id="${esc(sec.id)}" class="section-block">`;
    html += `
      <div class="section-header">
        <h2 class="section-title">${esc(sec.name)}</h2>
        <p class="section-desc">${esc(sec.desc)}</p>
      </div>`;
    
    if (sec.kind === 'wall') {
      html += '<div class="grid">';
      sec.items.forEach((item, j) => {
        html += `
          <div class="card" onclick="openLB('${esc(sec.id)}', ${j})">
            <div class="card-img-wrap">
              ${item.image ? `<img src="${esc(item.image)}" alt="${esc(item.title)}" loading="lazy">` : `<div class="card-placeholder">${esc(item.title)}</div>`}
            </div>
            <div class="card-body">
              <h3 class="card-title">${esc(item.title)}</h3>
              <p class="card-text">${esc(String(item.text||'').slice(0, 80))}...</p>
            </div>
          </div>`;
      });
      html += '</div>';
    } else {
      html += '<div class="notes-list">';
      sec.items.forEach(item => {
        html += `
          <div class="note-item">
            <h3 class="note-title">${esc(item.title)}</h3>
            <p class="note-text">${esc(item.text)}</p>
            ${item.link ? `<a href="${esc(item.link)}" target="_blank" class="note-link">লিংক দেখুন →</a>` : ''}
          </div>`;
      });
      html += '</div>';
    }
    html += `</section>`;
  });
  $('#main-content').innerHTML = html;
}

// Lightbox
function openLB(secId, itemIndex) {
  const sec = D.sections.find(s => s.id === secId);
  const item = sec.items[itemIndex];
  $('#lb-content').innerHTML = `
    <button class="lb-close" onclick="closeLB()">×</button>
    ${item.image ? `<img src="${esc(item.image)}" class="lb-img">` : ''}
    <div class="lb-body">
      <h3 class="lb-title">${esc(item.title)}</h3>
      <p class="lb-text">${esc(item.text)}</p>
      ${item.link ? `<a href="${esc(item.link)}" target="_blank" class="note-link" style="margin-top:20px;">লিংক দেখুন →</a>` : ''}
    </div>`;
  $('#lb').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeLB() {
  $('#lb').classList.remove('on');
  document.body.style.overflow = '';
}
$('#lb').addEventListener('click', e => { if(e.target.id === 'lb') closeLB(); });

// ✅ Form Submission (FormSubmit.co)
$('#contact-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#submit-btn');
  const status = $('#form-status');
  btn.disabled = true;
  btn.textContent = 'পাঠানো হচ্ছে...';
  status.className = 'form-status';
  status.textContent = '';

  const formData = new FormData(e.target);
  const object = Object.fromEntries(formData);
  const json = JSON.stringify(object);

  try {
    const res = await fetch("https://formsubmit.co/ajax/sukeshkhisa1@gmail.com", {
      method: "POST",
      headers: { 
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: json
    });
    
    if (res.ok) {
      status.textContent = '✅ আপনার মেসেজ সফলভাবে পাঠানো হয়েছে!';
      status.className = 'form-status success';
      e.target.reset();
    } else {
      throw new Error('Failed');
    }
  } catch (err) {
    status.textContent = '❌ দুঃখিত, মেসেজ পাঠানো সম্ভব হয়নি। আবার চেষ্টা করুন।';
    status.className = 'form-status error';
  } finally {
    btn.disabled = false;
    btn.textContent = 'মেসেজ পাঠান';
    setTimeout(() => { status.className = 'form-status'; }, 5000);
  }
});

async function boot() {
  try {
    const res = await fetch('content.json?v=' + Date.now());
    D = await res.json();
  } catch (e) {
    $('#main-content').innerHTML = '<p>ডেটা লোড করা যায়নি।</p>';
    return;
  }

  document.title = D.site.title + (D.site.en ? ' — ' + D.site.en : '');
  $('#nav-brand').textContent = D.site.title;
  $('#hero-title').textContent = D.site.title;
  $('#hero-role').textContent = D.site.role || '';
  $('#hero-tagline').textContent = D.site.tagline || '';
  $('#year').textContent = new Date().getFullYear();

  const navLinks = D.sections.map(s => {
    if (s.id === 'contact') return ''; 
    return `<a href="#${esc(s.id)}">${esc(s.name)}</a>`;
  }).join('');
  $('#nav-links').innerHTML = navLinks + '<a href="#contact">যোগাযোগ</a>';

  renderSections();
}
boot();
</script>
</body>
</html>
